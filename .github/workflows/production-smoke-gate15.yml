name: Production Smoke Gate-15

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "AUDIT_*.md"
      - "backup/README.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      execution_id:
        description: "Runtime evidence execution identifier"
        required: false
        default: "manual"
        type: string

concurrency:
  group: xtra-production-e2e-single-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SITE_URL: https://phanthuanxtra.com
      WORKER_URL: https://phanthuanxtra-v2.phanthuanmodelactor.workers.dev
      GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev
      GATEWAY_READ_TOKEN: ${{ secrets['GATEWAY_READ_TOKEN'] }}
      ADMIN_PASSWORD: ${{ secrets['ADMIN_PASSWORD'] }}
      ADMIN_TOKEN: ${{ secrets['ADMIN_TOKEN'] }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Record execution path
        shell: bash
        run: |
          echo "Runtime evidence execution: ${EXECUTION_ID:-manual}"
          echo "Trigger: ${GITHUB_EVENT_NAME}"
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
      - name: Smoke website and production Worker
        shell: bash
        run: |
          set -euo pipefail
          check_http_200() {
            local url="$1" label="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 1 --max-time 20 -o "$body" -w '%{http_code}' "$url")"
            echo "$label HTTP $status"
            test "$status" = "200"
            head -c 500 "$body"; echo
          }
          check_http_200 "$SITE_URL/" "Website"
          check_http_200 "$SITE_URL/api/health" "/api/health"
          check_http_200 "$SITE_URL/api/cars" "/api/cars"
          check_http_200 "$SITE_URL/admin.html" "/admin.html"
          check_http_200 "$WORKER_URL/" "Production Worker"
      - name: Compare editorial provenance on workers.dev and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for base in "$WORKER_URL" "$SITE_URL"; do
            echo "== $base/business-jets =="
            curl --silent --show-error --fail --compressed --max-time 30 -D /tmp/business-jets.headers -o /tmp/business-jets.html "$base/business-jets?probe=$GITHUB_SHA"
            grep -Ei '^(HTTP/|content-type:|x-ptx-editorial-utf8:|server:|cf-cache-status:|location:)' /tmp/business-jets.headers || true
            grep -Fq 'PHAN THUẦN XTRA' /tmp/business-jets.html
          done
      - name: Website Chat AI quota conservation
        run: echo "::notice::Routine CI does not call live /api/ai-chat inference; Workers AI quota is reserved for real website customers."
      - name: Smoke admin authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/admin.json -w '%{http_code}' -X POST "$SITE_URL/api/admin/login" -H 'content-type: application/json' --data '{"password":"__invalid_smoke_password__"}')"
          echo "Admin login invalid-credential boundary HTTP $status"
          test "$status" = "401"
          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/dashboard.json -w '%{http_code}' "$SITE_URL/api/admin/dashboard")"
          echo "Admin dashboard unauthenticated boundary HTTP $status"
          test "$status" = "401"
      - name: Smoke Developer Gateway public health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 1 --max-time 20 "$GATEWAY_URL/health" | tee /tmp/gateway-health.json
          jq -e '.ok == true and .service == "developer-gateway" and .unified_ai == true and .unified_ai_engine == "cloudflare-workers-ai"' /tmp/gateway-health.json >/dev/null
      - name: Smoke Developer Gateway authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/gateway-unauth.json -w '%{http_code}' -X POST "$GATEWAY_URL/v1/ai/unified" -H 'content-type: application/json' --data '{"instruction":"smoke unauthorized test"}')"
          echo "Gateway unauthenticated boundary HTTP $status"
          test "$status" = "401"
          jq -e '.ok == false and .error == "unauthorized"' /tmp/gateway-unauth.json >/dev/null
      - name: Gateway AI quota conservation
        run: echo "::notice::Routine CI does not call authenticated Gateway AI inference; Workers AI quota is reserved for real website customers."
      - name: Require Gateway credential for production gate
        if: ${{ env.GATEWAY_READ_TOKEN == '' }}
        run: |
          echo 'BLOCKED: GATEWAY_READ_TOKEN is not available in GitHub Actions.'
          exit 1
      - name: E2E Admin login and D1 create/read/delete
        if: ${{ env.ADMIN_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          TEST_CAR_ID="ci-e2e-${GITHUB_RUN_ID}"
          TEST_IMAGE_URL="https://phanthuanxtra.com/media/vehicles/publish-admin-${TEST_CAR_ID}.jpg"
          export TEST_CAR_ID TEST_IMAGE_URL
          admin_request() {
            local output="$1"; shift
            local attempt=1 status retry_after
            while [ "$attempt" -le 4 ]; do
              : > "$output"
              status="$(curl --silent --show-error --max-time 30 -D /tmp/admin-response.headers -o "$output" -w '%{http_code}' "$@")"
              echo "Admin API HTTP $status (attempt $attempt)"
              if [ "$status" != "429" ]; then ADMIN_LAST_STATUS="$status"; return 0; fi
              retry_after="$(awk 'tolower($1)=="retry-after:" {gsub("\r", "", $2); print $2; exit}' /tmp/admin-response.headers)"
              if ! [[ "$retry_after" =~ ^[0-9]+$ ]]; then retry_after=30; fi
              echo "Cloudflare rate limit (1015/429); waiting ${retry_after}s before retry"
              sleep "$retry_after"
              attempt=$((attempt + 1))
            done
            ADMIN_LAST_STATUS="429"; return 1
          }
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/admin-login.json -w '%{http_code}' -X POST "$SITE_URL/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          echo "Admin login HTTP $status"
          test "$status" = "200"
          ADMIN_SESSION="$(jq -r '.token // empty' /tmp/admin-login.json)"
          test -n "$ADMIN_SESSION"
          export ADMIN_SESSION
          trap 'admin_request /tmp/admin-cleanup.json -X DELETE "$SITE_URL/api/admin/cars/$TEST_CAR_ID" -H "Authorization: Bearer $ADMIN_SESSION" >/dev/null 2>&1 || true' EXIT
          admin_request /tmp/admin-create.json -X POST "$SITE_URL/api/admin/cars" -H "Authorization: Bearer $ADMIN_SESSION" -H 'content-type: application/json' --data "{\"id\":\"$TEST_CAR_ID\",\"brand\":\"PT XTRA TEST\",\"model\":\"CI E2E Vehicle\",\"year\":2026,\"mileage\":1,\"price\":1,\"fuel\":\"test\",\"category\":\"suv\",\"color\":\"test\",\"status\":\"hidden\",\"description\":\"CI production E2E test record; automatically deleted.\",\"features\":[\"e2e\"],\"images\":[\"$TEST_IMAGE_URL\"]}"
          test "$ADMIN_LAST_STATUS" = "201"
          jq -e '.ok == true and .id == env.TEST_CAR_ID' /tmp/admin-create.json >/dev/null
          admin_request /tmp/admin-cars.json -H "Authorization: Bearer $ADMIN_SESSION" "$SITE_URL/api/admin/cars"
          test "$ADMIN_LAST_STATUS" = "200"
          for attempt in 1 2 3 4; do
            if jq -e --arg id "$TEST_CAR_ID" '.cars | any(.[]; .id == $id and .brand == "PT XTRA TEST")' /tmp/admin-cars.json >/dev/null; then break; fi
            echo "D1 list visibility not observed yet; retrying read (attempt $attempt)."
            admin_request /tmp/admin-cars.json -H "Authorization: Bearer $ADMIN_SESSION" "$SITE_URL/api/admin/cars"
            test "$ADMIN_LAST_STATUS" = "200"
            sleep 2
          done
          jq -e --arg id "$TEST_CAR_ID" '.cars | any(.[]; .id == $id and .brand == "PT XTRA TEST")' /tmp/admin-cars.json >/dev/null
          admin_request /tmp/admin-delete.json -X DELETE "$SITE_URL/api/admin/cars/$TEST_CAR_ID" -H "Authorization: Bearer $ADMIN_SESSION"
          test "$ADMIN_LAST_STATUS" = "200"
          jq -e '.ok == true and .deleted == env.TEST_CAR_ID' /tmp/admin-delete.json >/dev/null
          admin_request /tmp/admin-cars-after-delete.json -H "Authorization: Bearer $ADMIN_SESSION" "$SITE_URL/api/admin/cars"
          test "$ADMIN_LAST_STATUS" = "200"
          jq -e --arg id "$TEST_CAR_ID" '(.cars | any(.[]; .id == $id)) | not' /tmp/admin-cars-after-delete.json >/dev/null
      - name: Require Admin credential for production E2E gate
        if: ${{ env.ADMIN_PASSWORD == '' }}
        run: |
          echo 'BLOCKED: ADMIN_PASSWORD is not available in GitHub Actions.'
          exit 1
      - name: Production credential safety policy
        shell: bash
        run: |
          echo '::notice::Password reset E2E: NOT RUN. Routine smoke must not change production passwords or recovery codes.'
          echo 'Use an isolated test environment for password-reset E2E; production credential changes require separate approval.'

      - name: E2E R2 media write/read/delete through Admin binding
        if: ${{ env.ADMIN_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/xtra-e2e.png
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-upload.json -w '%{http_code}' -X POST "$SITE_URL/api/admin/media" -H "X-Admin-Token: $ADMIN_TOKEN" -H 'content-type: image/png' --data-binary @/tmp/xtra-e2e.png)"
          echo "R2 write/upload HTTP $status"
          test "$status" = "200"
          MEDIA_KEY="$(jq -r '.key // empty' /tmp/media-upload.json)"
          test -n "$MEDIA_KEY"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 "$SITE_URL/media/$MEDIA_KEY" -o /tmp/xtra-e2e-download.png
          cmp /tmp/xtra-e2e.png /tmp/xtra-e2e-download.png
          echo 'R2 write/read: OK'
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-delete.json -w '%{http_code}' -X DELETE "$SITE_URL/api/admin/media/$MEDIA_KEY" -H "X-Admin-Token: $ADMIN_TOKEN")"
          echo "R2 delete HTTP $status"
          test "$status" = "200"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-after.json -w '%{http_code}' "$SITE_URL/media/$MEDIA_KEY")"
          echo "R2 read after delete HTTP $status"
          test "$status" = "404"
      - name: Production detail-page smoke
        shell: bash
        run: |
          echo 'Skipped: legacy example page car-lx600.html was intentionally removed from production.'
      - name: Production smoke summary
        shell: bash
        run: |
          set -euo pipefail
          echo '========================================'
          echo 'Production smoke checks passed'
          echo "Site: $SITE_URL"
          echo "Worker: $WORKER_URL"
          echo 'Legacy example page: removed'
          echo '========================================'