name: App Sentiment Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/app-api.js"
      - ".github/workflows/app-sentiment-production-e2e.yml"

permissions:
  contents: read

jobs:
  sentiment-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SITE_URL: https://phanthuanxtra.com
      ADMIN_PASSWORD: ${{ secrets['ADMIN_PASSWORD'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_PASSWORD:-}" || { echo 'BLOCKED: ADMIN_PASSWORD unavailable'; exit 1; }
      - name: Authenticate App API and verify sentiment
        shell: bash
        run: |
          set -euo pipefail
          login_status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/app-login.json -w '%{http_code}' -X POST "$SITE_URL/api/app/v1/login" -H 'content-type: application/json' --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          echo "App API login HTTP $login_status"
          test "$login_status" = "200"
          APP_TOKEN="$(jq -r '.token // empty' /tmp/app-login.json)"
          test -n "$APP_TOKEN"
          status="$(curl --silent --show-error --max-time 90 -o /tmp/sentiment.json -w '%{http_code}' -X POST "$SITE_URL/api/app/v1/sentiment" -H "Authorization: Bearer $APP_TOKEN" -H 'content-type: application/json' --data '{"text":"Dịch vụ tư vấn rất tốt và chuyên nghiệp."}')"
          echo "Sentiment HTTP $status"
          test "$status" = "200"
          jq -e '.ok == true and .model == "@cf/huggingface/distilbert-sst-2-int8" and .result != null' /tmp/sentiment.json >/dev/null
          echo "App Sentiment production E2E: PASS"
          echo "Model: @cf/huggingface/distilbert-sst-2-int8"
