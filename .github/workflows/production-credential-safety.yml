name: Production Credential Safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  credential-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject credential mutations in routine smoke workflows
        shell: python
        run: |
          from pathlib import Path
          import re
          paths = [
              ".github/workflows/production-smoke.yml",
              ".github/workflows/production-smoke-gate15.yml",
          ]
          forbidden = [
              r"/api/admin/recovery/rotate",
              r"/api/admin/forgot-password",
              r"ADMIN_RECOVERY_ROTATE_TOKEN",
              r"Password Reset:\s*PASS",
          ]
          for path in paths:
              content = Path(path).read_text()
              for pattern in forbidden:
                  if re.search(pattern, content, re.I):
                      raise SystemExit(f"{path}: forbidden credential mutation or misleading reset result")
              for marker in [
                  "Password reset E2E: NOT RUN",
                  "E2E Admin login and D1 create/read/delete",
                  "E2E R2 media write/read/delete through Admin binding",
                  "Smoke admin authentication boundary",
              ]:
                  if marker not in content:
                      raise SystemExit(f"{path}: missing safety or retained-check marker")
              print(f"{path}: credential safety contract PASS")
