name: Stage 3 self patch

on:
  push:
    branches:
      - fix/stage3-d1-rate-limit-backoff

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch D1 E2E and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage3-production-reconciliation.yml')
          s=p.read_text()
          old='''          id="stage3-${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$payload")"
          test "$status" = "200"
          token="$(jq -r '.token // empty' /tmp/login.json)"
          test -n "$token"
          trap 'curl --silent --show-error --retry 2 --max-time 20 -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}" >/dev/null || true' EXIT
          create_payload="$(jq -nc --arg id "$id" --arg image "https://phanthuanxtra.com/media/vehicles/publish-admin-${id}.jpg" '{id:$id,brand:"PT XTRA STAGE3",model:"Runtime E2E",year:2026,mileage:1,price:1,fuel:"test",category:"suv",color:"test",status:"available",description:"temporary Stage 3 runtime evidence",features:["e2e"],images:[{url:$image}]}')"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/cars" -H "Authorization: Bearer ${token}" -H 'content-type: application/json' --data "$create_payload" | tee /tmp/create.json
          jq -e --arg id "$id" '.ok == true and .id == $id' /tmp/create.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -H "Authorization: Bearer ${token}" "${SITE_URL}/api/admin/cars" | tee /tmp/read.json
          jq -e --arg id "$id" '.cars | any(.[]; .id == $id)' /tmp/read.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}" | tee /tmp/delete.json
          jq -e '.ok == true' /tmp/delete.json >/dev/null
          echo "D1 CRUD: PASS"'''
          new='''          id="stage3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$payload")"
          test "$status" = "200"
          token="$(jq -r '.token // empty' /tmp/login.json)"
          test -n "$token"
          cleanup() {
            for delay in 0 10 20 30; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              status="$(curl --silent --show-error --retry 1 --max-time 20 -o /tmp/cleanup.json -w '%{http_code}' -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}")" || true
              if [ "$status" = "200" ]; then return 0; fi
            done
            return 0
          }
          trap cleanup EXIT
          create_payload="$(jq -nc --arg id "$id" --arg image "https://phanthuanxtra.com/media/vehicles/publish-admin-${id}.jpg" '{id:$id,brand:"PT XTRA STAGE3",model:"Runtime E2E",year:2026,mileage:1,price:1,fuel:"test",category:"suv",color:"test",status:"available",description:"temporary Stage 3 runtime evidence",features:["e2e"],images:[{url:$image}]}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 60 -X POST "${SITE_URL}/api/admin/cars" -H "Authorization: Bearer ${token}" -H 'content-type: application/json' --data "$create_payload" | tee /tmp/create.json
          jq -e --arg id "$id" '.ok == true and .id == $id' /tmp/create.json >/dev/null
          read_ok=false
          for delay in 5 10 20 30; do
            sleep "$delay"
            status="$(curl --silent --show-error --retry 1 --max-time 30 -o /tmp/read.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "${SITE_URL}/api/admin/cars")" || true
            if [ "$status" = "200" ] && jq -e --arg id "$id" '.cars | any(.[]; .id == $id)' /tmp/read.json >/dev/null 2>&1; then
              read_ok=true
              break
            fi
            echo "D1 read retry: HTTP ${status}"
          done
          test "$read_ok" = true
          for delay in 0 10 20 30; do
            [ "$delay" -eq 0 ] || sleep "$delay"
            status="$(curl --silent --show-error --retry 1 --max-time 30 -o /tmp/delete.json -w '%{http_code}' -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}")" || true
            if [ "$status" = "200" ] && jq -e '.ok == true' /tmp/delete.json >/dev/null 2>&1; then
              echo "D1 CRUD: PASS"
              exit 0
            fi
            echo "D1 delete retry: HTTP ${status}"
          done
          exit 1'''
          if old not in s:
              raise SystemExit('expected D1 block not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/_stage3_self_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/stage3-production-reconciliation.yml .github/workflows/_stage3_self_patch.yml
          git commit -m 'test(stage3): back off D1 E2E on Cloudflare 1015'
          git push origin HEAD:fix/stage3-d1-rate-limit-backoff