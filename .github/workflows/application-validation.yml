name: Application Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.json'
      - '.github/workflows/application-validation.yml'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - name: Validate JavaScript syntax
        run: |
          node --check src/entry.js
          node --check src/cms.js
          node --check src/index.js
          node --check src/app-api.js
          node --check src/ai-chat.js
          node --check src/telegram-lookup.js
          node --check src/vip-telegram.js
          node --check src/vip-vehicle-intelligence.js
      - name: Guard Workers AI model IDs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git \
            -E '@cf/meta/llama-3\.1-8b-instruct(["@]|[^a-zA-Z0-9_-])' src tests; then
            echo "ERROR: deprecated Workers AI model ID detected"; exit 1
          fi
          if grep -n '@cf/meta/llama-3.2-3b-instruct' src/ai-chat.js; then
            echo "ERROR: legacy website AI fallback detected"; exit 1
          fi
          grep -n '@cf/zai-org/glm-4.7-flash' src/ai-chat.js
          grep -n '@cf/qwen/qwen3.8-27b' src/ai-chat.js
          grep -n '@cf/nvidia/nemotron-3-120b-a12b' src/ai-chat.js
          echo "Workers AI model guard passed"
      - name: Unit tests
        run: |
          node --test tests/*.test.mjs
          node --test developer-gateway/test/index.test.mjs
      - name: Validate deployment configuration without deployment CLI
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.json','utf8'));
          if(cfg.main!=='src/entry.js') throw new Error('Unexpected Worker entrypoint');
          for(const key of ['assets','ai','images','r2_buckets','d1_databases']) if(!cfg[key]) throw new Error('Missing required config: '+key);
          console.log('Worker deployment configuration: PASS (static validation only)');
          NODE
      - name: Verify no runtime DDL
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha" -- 'src/**' 'public/**' 'developer-gateway/**')"
          if [ -z "$changed_files" ]; then echo "NO RUNTIME FILES CHANGED"; exit 0; fi
          printf '%s\n' "$changed_files"
          if git diff --unified=0 "$base_sha" "$head_sha" -- $changed_files | grep -E '^\+.*(CREATE TABLE|CREATE INDEX|ALTER TABLE|DROP TABLE|DROP INDEX)'; then
            echo "ERROR: runtime DDL added by this pull request"; exit 1
          fi
          echo "NO RUNTIME DDL ADDED BY THIS PULL REQUEST"
