name: Thư ký Phan Thuần — VoiceMem APK
on:
  push:
    branches: [standalone/thuky-phanthuan-voicemem-apk]
    paths:
      - 'voicemem-apk/**'
      - '.github/workflows/thuky-phanthuan-voicemem-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'voicemem-apk/**'
      - '.github/workflows/thuky-phanthuan-voicemem-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-voicemem-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicemem-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify standalone package
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -p "$apk" AndroidManifest.xml >/dev/null
          sha256sum "$apk"
          echo 'Standalone package: com.phanthuan.thuky'
          echo 'App label: Thư ký Phan Thuần'
          echo 'VoiceMem is NOT added to the production Phan Thuần Xtra APK.'
      - uses: actions/upload-artifact@v4
        with:
          name: thuky-phanthuan-voicemem-apk
          path: voicemem-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
