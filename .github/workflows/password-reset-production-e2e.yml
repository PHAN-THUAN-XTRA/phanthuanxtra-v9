name: Password Reset Production E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PASSWORD-RESET-PRODUCTION-E2E to authorize
        required: true
        type: string
      reason:
        description: Audit reason
        required: true
        type: string

  push:
    branches:
      - main
    paths:
      - '.github/workflows/password-reset-production-e2e.yml'

permissions:
  contents: read

concurrency:
  group: password-reset-production-e2e
  cancel-in-progress: false

env:
  SITE_URL: https://phanthuanxtra.com

jobs:
  password-reset:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Verify authorization
        env:
          CONFIRM: ${{ github.event_name == 'push' && 'PASSWORD-RESET-PRODUCTION-E2E' || inputs.confirm }}
          REASON: ${{ github.event_name == 'push' && format('Automatic production Password Reset E2E after main workflow change ({0})', github.sha) || inputs.reason }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "PASSWORD-RESET-PRODUCTION-E2E"
          test -n "$REASON"
          echo "Password Reset E2E authorization accepted."

      - name: Verify production health
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 --retry-delay 1 --max-time 20 -o "$body" -w '%{http_code}' "$SITE_URL/api/health")"
          echo "Production health HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true' "$body" >/dev/null
          rm -f "$body"

      - name: Password reset production E2E
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RECOVERY_ROTATE_TOKEN: ${{ secrets.ADMIN_RECOVERY_ROTATE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_PASSWORD:-}"
          test -n "${RECOVERY_ROTATE_TOKEN:-}"
          trap 'unset ADMIN_PASSWORD RECOVERY_ROTATE_TOKEN recovery_code temporary_password' EXIT

          # Bootstrap recovery independently of ADMIN_PASSWORD because D1 may
          # still contain the previous password hash.
          rotate_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$rotate_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg t "$RECOVERY_ROTATE_TOKEN" '{rotateToken:$t}')" "$SITE_URL/api/admin/recovery/rotate")"
          echo "Recovery bootstrap rotation HTTP ${status}"
          test "$status" = 200
          recovery_code="$(jq -er '.recoveryCode' "$rotate_body")"
          test -n "$recovery_code"
          rm -f "$rotate_body"

          # Synchronize production D1 admin_credentials to the canonical
          # Actions ADMIN_PASSWORD through the real recovery endpoint.
          restore_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 30 -o "$restore_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg c "$recovery_code" --arg p "$ADMIN_PASSWORD" '{recoveryCode:$c,password:$p,confirm:$p}')" "$SITE_URL/api/admin/forgot-password")"
          echo "D1 ADMIN_PASSWORD bootstrap reset HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true' "$restore_body" >/dev/null
          rm -f "$restore_body"

          login_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$login_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')" "$SITE_URL/api/admin/login")"
          echo "Baseline Admin login HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true and (.token | type == "string")' "$login_body" >/dev/null
          rm -f "$login_body"

          temporary_password="XTRA-E2E-$(openssl rand -hex 12)"

          wrong_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$wrong_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg p "$temporary_password" '{recoveryCode:"__invalid_recovery_code__",password:$p,confirm:$p}')" "$SITE_URL/api/admin/forgot-password")"
          echo "Wrong recovery code HTTP ${status}"
          test "$status" = 401
          rm -f "$wrong_body"

          mismatch_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$mismatch_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg c "$recovery_code" --arg p "$temporary_password" '{recoveryCode:$c,password:$p,confirm:(($p)+"-mismatch")}')" "$SITE_URL/api/admin/forgot-password")"
          echo "Password mismatch HTTP ${status}"
          test "$status" = 400
          rm -f "$mismatch_body"

          reset_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 30 -o "$reset_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg c "$recovery_code" --arg p "$temporary_password" '{recoveryCode:$c,password:$p,confirm:$p}')" "$SITE_URL/api/admin/forgot-password")"
          echo "Temporary password reset HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true' "$reset_body" >/dev/null
          rm -f "$reset_body"

          old_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$old_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')" "$SITE_URL/api/admin/login")"
          echo "Old password login HTTP ${status}"
          test "$status" = 401
          rm -f "$old_body"

          new_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$new_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg p "$temporary_password" '{password:$p}')" "$SITE_URL/api/admin/login")"
          echo "Temporary password login HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true and (.token | type == "string")' "$new_body" >/dev/null
          rm -f "$new_body"

          restore_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 30 -o "$restore_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg c "$recovery_code" --arg p "$ADMIN_PASSWORD" '{recoveryCode:$c,password:$p,confirm:$p}')" "$SITE_URL/api/admin/forgot-password")"
          echo "Password restore HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true' "$restore_body" >/dev/null
          rm -f "$restore_body"

          final_body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o "$final_body" -w '%{http_code}' -H 'content-type: application/json' -d "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')" "$SITE_URL/api/admin/login")"
          echo "Restored password login HTTP ${status}"
          test "$status" = 200
          jq -e '.ok == true and (.token | type == "string")' "$final_body" >/dev/null
          rm -f "$final_body"

          echo "PASSWORD_RESET_PRODUCTION_E2E=PASS"
