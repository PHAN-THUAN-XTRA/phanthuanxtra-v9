name: Cloudflare Rate Limit Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ZONE_ID: 7b2653821ef0d8052bfc91c4cf5008ca
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
    steps:
      - name: Audit Cloudflare http_ratelimit rules
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for token in "$CF_PRIMARY_TOKEN" "$CF_BACKUP_TOKEN"; do
            [ -n "$token" ] || continue
            status="$(curl -sS --max-time 30 -o /tmp/ruleset.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/rulesets/phases/http_ratelimit/entrypoint" -H "Authorization: Bearer $token")"
            if [ "$status" = 200 ] && jq -e '.success == true' /tmp/ruleset.json >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Existing Cloudflare tokens cannot read http_ratelimit rules. Grant the GitHub Actions token Zone WAF/Rulesets read permission; never paste it into chat."
            jq -c '{success,errors}' /tmp/ruleset.json 2>/dev/null || true
            exit 1
          fi
          jq -r '.result as $r | "ruleset_id=\($r.id) phase=\($r.phase) rules=\(($r.rules // [])|length)"' /tmp/ruleset.json
          jq -c '.result.rules[]? | {id,description,enabled,expression,action,ratelimit}' /tmp/ruleset.json
          echo "Audit is read-only; no Cloudflare configuration changed."
