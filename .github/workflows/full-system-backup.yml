# Gate 14 runtime trigger after token capability split.
name: Full System Backup

on:
  workflow_dispatch:
  push:
    paths:
      - MASTER_PROJECT_STATUS.md
      - .github/workflows/full-system-backup.yml
      - .github/workflows/gate-14-backup-restore.yml
      - scripts/full-system-backup.mjs
  schedule:
    - cron: "0 0 * * *" # 07:00 Vietnam (UTC+7)

permissions:
  contents: read

concurrency:
  group: full-system-backup
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
  CLOUDFLARE_PRIMARY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TELEGRAM_BACKUP_BOT_TOKEN: ${{ secrets.TELEGRAM_BACKUP_BOT_TOKEN }}
  TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}
  WORKER_NAME: phanthuanxtra-v2
  D1_DATABASE_ID: 8b6c0fc8-c278-4797-9cfa-3ec93d0c1b7d
  R2_BUCKET: phanthuanxtra-media
  ZONE_NAME: phanthuanxtra.com
  BACKUP_ROOT: backup-artifact/run-${{ github.run_id }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Cloudflare backup credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_BACKUP_API_TOKEN" || test -n "$CLOUDFLARE_PRIMARY_API_TOKEN"

      - name: Preflight Cloudflare token capabilities and D1 access
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local token="$1"; local path="$2"
            local status attempt
            for attempt in 1 2 3; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4${path}")"
              if [ "$status" != "429" ]; then echo "$status"; return 0; fi
              sleep $((attempt * 2))
            done
            echo "$status"
          }
          probe_d1_read() {
            local token="$1"
            local query_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
            local schema_body table_name table_sql data_status attempt
            for attempt in 1 2 3; do
              schema_body="$(curl -sS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"sql":"SELECT name FROM sqlite_master WHERE type = '\''table'\'' AND name NOT LIKE '\''sqlite_%'\'' LIMIT 1"}' "$query_url")"
              table_name="$(printf '%s' "$schema_body" | jq -r '.result[0].results[0].name // empty')"
              if [ -z "$table_name" ]; then
                if printf '%s' "$schema_body" | jq -e '.success == true' >/dev/null; then echo "200"; return 0; fi
                echo "401"; return 0
              fi
              table_sql="${table_name//\"/\"\"}"
              data_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data "{\"sql\":\"SELECT * FROM \"\"$table_sql\"\" LIMIT 1\"}" "$query_url")"
              if [ "$data_status" != "429" ]; then echo "$data_status"; return 0; fi
              sleep $((attempt * 2))
            done
            echo "$data_status"
          }
          worker_token_works() {
            local token="$1"; [ -n "$token" ] || return 1
            local worker_status deployments_status script_settings_status settings_status r2_status zone_status
            worker_status="$(probe "$token" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME")"
            deployments_status="$(probe "$token" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments")"
            script_settings_status="$(probe "$token" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/script-settings")"
            settings_status="$(probe "$token" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
            r2_status="$(probe "$token" "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET/objects?per_page=1")"
            zone_status="$(probe "$token" "/zones?name=$ZONE_NAME&status=active&per_page=50")"
            echo "Worker/R2 capability probe: worker=$worker_status deployments=$deployments_status script_settings=$script_settings_status settings=$settings_status r2=$r2_status zone=$zone_status"
            [ "$worker_status" = "200" ] && [ "$deployments_status" = "200" ] && [ "$script_settings_status" = "200" ] && [ "$settings_status" = "200" ] && [ "$r2_status" = "200" ] && [ "$zone_status" = "200" ]
          }
          worker_token=""; worker_source=""
          if worker_token_works "$CLOUDFLARE_BACKUP_API_TOKEN"; then worker_token="$CLOUDFLARE_BACKUP_API_TOKEN"; worker_source="backup"
          elif worker_token_works "$CLOUDFLARE_PRIMARY_API_TOKEN"; then worker_token="$CLOUDFLARE_PRIMARY_API_TOKEN"; worker_source="primary"
          fi
          d1_token=""; d1_source=""
          backup_d1_status="$(probe_d1_read "$CLOUDFLARE_BACKUP_API_TOKEN")"
          if [ "$backup_d1_status" = "200" ]; then d1_token="$CLOUDFLARE_BACKUP_API_TOKEN"; d1_source="backup"; else
            primary_d1_status="$(probe_d1_read "$CLOUDFLARE_PRIMARY_API_TOKEN")"
            if [ "$primary_d1_status" = "200" ]; then d1_token="$CLOUDFLARE_PRIMARY_API_TOKEN"; d1_source="primary"; fi
          fi
          echo "D1 read capability: backup=$backup_d1_status selected=${d1_source:-none}"
          if [ -z "$worker_token" ] || [ -z "$d1_token" ]; then echo "No configured Cloudflare token set covers required Worker/R2 and D1 read capabilities."; exit 1; fi
          echo "Worker/R2 token source selected: $worker_source"
          echo "D1 read token source selected: $d1_source"
          printf 'CLOUDFLARE_EFFECTIVE_API_TOKEN=%s\n' "$worker_token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_D1_API_TOKEN=%s\n' "$d1_token" >> "$GITHUB_ENV"

      - name: Run full-system collector
        run: node scripts/full-system-backup.mjs
      - name: Verify collected backup checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_ROOT/SHA256SUMS"
          (cd "$BACKUP_ROOT" && sha256sum -c SHA256SUMS)
          test -s "$BACKUP_ROOT/manifest.json"
          node -e "const m=require('./$BACKUP_ROOT/manifest.json'); if(m.secret_values_included!==false) throw new Error('backup manifest claims secret values are included'); if(m.components?.d1_sql_export!==true) throw new Error('D1 export missing'); if(m.components?.r2_object_content!==true) throw new Error('R2 content missing');"
      - name: Create compressed archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$BACKUP_ROOT" -czf full-system-backup.tar.gz .
          sha256sum full-system-backup.tar.gz > full-system-backup.tar.gz.sha256
          ls -lh full-system-backup.tar.gz full-system-backup.tar.gz.sha256
      - name: Verify compressed archive integrity
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"; trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf full-system-backup.tar.gz -C "$verify_dir"
          test -s "$verify_dir/SHA256SUMS"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)
          test -s "$verify_dir/manifest.json"
          echo "Archive integrity: PASS"
      - name: Upload full backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-full-system-backup-${{ github.run_id }}
          path: |
            full-system-backup.tar.gz
            full-system-backup.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Send backup result and compact manifest to Telegram
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BACKUP_BOT_TOKEN" ] || [ -z "$TELEGRAM_BACKUP_CHAT_ID" ]; then echo "Telegram backup notification skipped: Telegram secrets are not configured."; exit 0; fi
          status="${{ job.status }}"; size="unknown"
          if [ -f full-system-backup.tar.gz ]; then size="$(du -h full-system-backup.tar.gz | cut -f1)"; fi
          text=$(printf '📦 <b>Backup phanthuanxtra.com — FULL SYSTEM</b>\n⏰ 07:00 VN\n🔄 daily\n📊 status: %s\n💾 archive: %s\n🧩 GitHub + Worker + bindings + D1 + R2 + routes + manifest + SHA-256\n🔐 secret values: excluded' "$status" "$size")
          curl --fail --silent --show-error --data-urlencode "chat_id=$TELEGRAM_BACKUP_CHAT_ID" --data-urlencode "text=$text" --data-urlencode "parse_mode=HTML" "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/sendMessage"
          if [ -f full-system-backup.tar.gz ] && [ "$(stat -c%s full-system-backup.tar.gz)" -le 49000000 ]; then curl --fail --silent --show-error -F "chat_id=$TELEGRAM_BACKUP_CHAT_ID" -F "document=@full-system-backup.tar.gz" -F "caption=Full-system backup archive — ${{ github.sha }}" "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/sendDocument"; fi
          if [ -f "$BACKUP_ROOT/manifest.json" ]; then curl --fail --silent --show-error -F "chat_id=$TELEGRAM_BACKUP_CHAT_ID" -F "document=@$BACKUP_ROOT/manifest.json" -F "caption=Backup manifest — ${{ github.sha }}" "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/sendDocument"; fi
          if [ -f full-system-backup.tar.gz.sha256 ]; then curl --fail --silent --show-error -F "chat_id=$TELEGRAM_BACKUP_CHAT_ID" -F "document=@full-system-backup.tar.gz.sha256" -F "caption=Backup SHA-256 — ${{ github.sha }}" "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/sendDocument"; fi
