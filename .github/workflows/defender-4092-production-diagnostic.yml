name: Defender 4092 Production Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only D1 and R2 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      DB_ID: 8b6c0fc8-c278-4797-9cfa-3ec93d0c1b7d
    steps:
      - name: Resolve read credential
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in "${CF_PRIMARY_TOKEN:-}" "${CF_BACKUP_TOKEN:-}"; do
            [ -n "$candidate" ] || continue
            if curl --fail --silent --show-error -H "Authorization: Bearer $candidate" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID" >/dev/null; then selected="$candidate"; break; fi
          done
          [ -n "$selected" ] || { echo "No Cloudflare credential can read production D1."; exit 1; }
          echo "::add-mask::$selected"
          echo "CF_TOKEN=$selected" >> "$GITHUB_ENV"
      - name: Inspect Defender session, inbox, draft and media
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local sql="$1"
            curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"
          }
          echo "=== SESSION ==="
          q "SELECT session_key,status,opened_message_id,created_at,updated_at FROM telegram_vehicle_sessions WHERE session_key='6451516147:vehicle-session:4092' OR (chat_id='6451516147' AND session_key LIKE '%:vehicle-session:%') ORDER BY updated_at DESC LIMIT 5" | jq -c '.result[0].results'
          echo "=== INBOX COUNTS ==="
          q "SELECT bundle_status,status,COUNT(*) AS n,COUNT(processed_image_url) AS processed FROM telegram_inbox WHERE chat_id='6451516147' AND bundle_key='6451516147:vehicle-session:4092' GROUP BY bundle_status,status ORDER BY bundle_status,status" | jq -c '.result[0].results'
          echo "=== INBOX ROWS ==="
          q "SELECT id,message_id,bundle_status,status,CASE WHEN file_id IS NULL THEN 0 ELSE 1 END AS is_photo,CASE WHEN processed_image_url IS NULL OR processed_image_url='' THEN 0 ELSE 1 END AS has_processed_url,error,updated_at FROM telegram_inbox WHERE chat_id='6451516147' AND bundle_key='6451516147:vehicle-session:4092' ORDER BY id" | jq -c '.result[0].results'
          echo "=== DRAFTS ==="
          q "SELECT inbox_id,status,confidence,source_file_path,substr(source_caption,1,180) AS source_caption,json_extract(ai_json,'$.image_count') AS image_count,json_extract(ai_json,'$.price') AS price,json_extract(ai_json,'$._owner_price_locked') AS owner_price_locked,json_extract(ai_json,'$._owner_values_locked') AS owner_values_locked,json_extract(ai_json,'$.bundle_key') AS bundle_key,updated_at FROM vehicle_ai_drafts WHERE inbox_id IN (SELECT id FROM telegram_inbox WHERE chat_id='6451516147') ORDER BY updated_at DESC LIMIT 10" | jq -c '.result[0].results'
          echo "=== MEDIA ASSET COUNTS FOR DEFENDER INBOX IDS ==="
          q "SELECT COUNT(*) AS n,MIN(created_at) AS first_created,MAX(created_at) AS last_created FROM media_assets WHERE r2_key LIKE 'vehicles/telegram-%' AND EXISTS (SELECT 1 FROM telegram_inbox t WHERE t.chat_id='6451516147' AND instr(r2_key,'telegram-'||t.id||'-')>0)" | jq -c '.result[0].results'
          echo "Diagnostic is read-only: no D1 mutation, R2 mutation, publish, or Telegram command."
