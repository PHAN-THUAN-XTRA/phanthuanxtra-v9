name: Decommission God's Eye View

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decommission-gods-eye-view.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decommission:
    name: Remove God's Eye View from Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      TARGET_HOSTNAME: eye.phanthuanxtra.com
      TARGET_WORKER: phanthuanxtra-gods-eye-view

    steps:
      - name: Decommission and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          tokens=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && tokens+=("$CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_BACKUP_API_TOKEN:-}" ] && tokens+=("$CLOUDFLARE_BACKUP_API_TOKEN")
          [ "${#tokens[@]}" -gt 0 ] || { echo "No Cloudflare Worker token is configured."; exit 1; }

          ACTIVE_TOKEN=""
          for candidate in "${tokens[@]}"; do
            status="$(curl --silent --show-error -o /tmp/domains.json -w '%{http_code}'               -H "Authorization: Bearer $candidate"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$TARGET_HOSTNAME")" || true
            echo "Workers domains list HTTP $status"
            if [ "$status" = "200" ] && jq -e '.success == true and (.result | type == "array")' /tmp/domains.json >/dev/null 2>&1; then
              ACTIVE_TOKEN="$candidate"
              break
            fi
            jq -c '{success,errors,messages}' /tmp/domains.json 2>/dev/null || true
          done
          [ -n "$ACTIVE_TOKEN" ] || { echo "No configured token can read Worker domains."; exit 1; }

          delete_api() {
            local url="$1" label="$2" status body
            body="$(mktemp)"
            for candidate in "${tokens[@]}"; do
              status="$(curl --silent --show-error -o "$body" -w '%{http_code}' -X DELETE                 -H "Authorization: Bearer $candidate" "$url")" || true
              echo "$label DELETE HTTP $status"
              if [ "$status" = "204" ]; then return 0; fi
              if [ "$status" = "200" ]; then
                if [ ! -s "$body" ] || jq -e '.success == true' "$body" >/dev/null 2>&1; then return 0; fi
              fi
              if [ "$status" = "404" ]; then return 0; fi
            done
            jq -c '{success,errors,messages}' "$body" 2>/dev/null || true
            return 1
          }

          mapfile -t ids < <(jq -r --arg h "$TARGET_HOSTNAME" '.result[]? | select(.hostname == $h) | .id' /tmp/domains.json)
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "Custom domain already absent: $TARGET_HOSTNAME"
          else
            for id in "${ids[@]}"; do
              delete_api                 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$id"                 "Worker domain"
              echo "Detached custom domain: $TARGET_HOSTNAME"
            done
          fi

          status="$(curl --silent --show-error -o /tmp/domains-after.json -w '%{http_code}'             -H "Authorization: Bearer $ACTIVE_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$TARGET_HOSTNAME")" || true
          echo "Worker domains verification HTTP $status"
          test "$status" = "200"
          jq -e --arg h "$TARGET_HOSTNAME"             '.success == true and ([.result[]? | select(.hostname == $h)] | length == 0)'             /tmp/domains-after.json >/dev/null
          echo "Custom domain detach verification: PASS"

          delete_api             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"             "Worker script"

          worker_absent=0
          for candidate in "${tokens[@]}"; do
            status="$(curl --silent --show-error -o /tmp/worker-get.json -w '%{http_code}'               -H "Authorization: Bearer $candidate"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER")" || true
            echo "Worker post-delete GET HTTP $status"
            if [ "$status" = "404" ]; then worker_absent=1; break; fi
          done
          test "$worker_absent" = "1"
          echo "Dedicated Worker deletion verification: PASS"

          status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "https://$TARGET_HOSTNAME/")" || status=000
          echo "$TARGET_HOSTNAME HTTP $status"
          case "$status" in
            000|404|410|530) ;;
            *) echo "Endpoint still appears routable; refusing false decommission success."; exit 1 ;;
          esac
          echo "Public endpoint decommission verification: PASS"
