name: Owner HUMMER 786 MASTER Gallery Reorder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reorder-tg786-gallery.yml"
      - "scripts/reorder-tg786-master-gallery.mjs"
  pull_request:
    paths:
      - ".github/workflows/reorder-tg786-gallery.yml"
      - "scripts/reorder-tg786-master-gallery.mjs"
      - "tests/reorder-tg786-master-gallery.test.mjs"

permissions:
  contents: read

concurrency:
  group: production-tg786-gallery-order
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify HUMAN FIRST + all 24 photos + safe idempotent order
        run: |
          node --check scripts/reorder-tg786-master-gallery.mjs
          node --test tests/reorder-tg786-master-gallery.test.mjs

  reorder:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Change only image sort_order and cover, verify public API
        run: node scripts/reorder-tg786-master-gallery.mjs
