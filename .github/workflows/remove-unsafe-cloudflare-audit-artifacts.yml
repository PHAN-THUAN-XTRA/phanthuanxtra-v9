name: Remove Unsafe Cloudflare Audit Artifacts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-unsafe-cloudflare-audit-artifacts.yml
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-fix audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for id in 10680328206 10680711498 10680792704; do
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id")"
            echo "artifact $id delete HTTP $status"
            test "$status" = "204" || test "$status" = "404"
          done
          echo "Unsafe pre-fix audit artifacts removed."
