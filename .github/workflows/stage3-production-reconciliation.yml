name: Stage 3 Production Reconciliation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3-production-reconciliation
  cancel-in-progress: false

env:
  SITE_URL: https://phanthuanxtra.com
  GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev

jobs:
  reconcile:
    name: Current-lineage D1 Gateway AI Admin R2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Record lineage
        run: |
          set -euo pipefail
          echo "Stage 3 source SHA: ${GITHUB_SHA}"
          echo "Stage 3 ref: ${GITHUB_REF}"

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health /api/cars /admin.html; do
            status="$(curl --silent --show-error --retry 3 --max-time 20 -o /dev/null -w '%{http_code}' "${SITE_URL}${path}")"
            echo "${path} HTTP ${status}"
            test "$status" = "200"
          done

      - name: Admin authentication boundaries
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/invalid.json -w '%{http_code}' -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data '{"password":"__stage3_invalid__"}')"
          echo "Invalid Admin login HTTP ${status}"
          test "$status" = "401"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/unauth.json -w '%{http_code}' "${SITE_URL}/api/admin/dashboard")"
          echo "Unauthenticated dashboard HTTP ${status}"
          test "$status" = "401"

      - name: D1 CRUD production E2E
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          id="stage3-${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$payload")"
          test "$status" = "200"
          token="$(jq -r '.token // empty' /tmp/login.json)"
          test -n "$token"
          trap 'curl --silent --show-error --retry 2 --max-time 20 -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}" >/dev/null || true' EXIT
          create_payload="$(jq -nc --arg id "$id" --arg image "https://phanthuanxtra.com/media/vehicles/publish-admin-${id}.jpg" '{id:$id,brand:"PT XTRA STAGE3",model:"Runtime E2E",year:2026,mileage:1,price:1,fuel:"test",category:"suv",color:"test",status:"available",description:"temporary Stage 3 runtime evidence",features:["e2e"],images:[{url:$image}]}')"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/cars" -H "Authorization: Bearer ${token}" -H 'content-type: application/json' --data "$create_payload" | tee /tmp/create.json
          jq -e --arg id "$id" '.ok == true and .id == $id' /tmp/create.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -H "Authorization: Bearer ${token}" "${SITE_URL}/api/admin/cars" | tee /tmp/read.json
          jq -e --arg id "$id" '.cars | any(.[]; .id == $id)' /tmp/read.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}" | tee /tmp/delete.json
          jq -e '.ok == true' /tmp/delete.json >/dev/null
          echo "D1 CRUD: PASS"

      - name: Developer Gateway health and auth
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --max-time 20 "${GATEWAY_URL}/health" | tee /tmp/gateway.json
          jq -e '.ok == true and .service == "developer-gateway" and .unified_ai == true and .unified_ai_engine == "cloudflare-workers-ai"' /tmp/gateway.json >/dev/null
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/gateway-unauth.json -w '%{http_code}' -X POST "${GATEWAY_URL}/v1/ai/unified" -H 'content-type: application/json' --data '{"instruction":"stage3 unauthorized"}')"
          test "$status" = "401"
          test -n "$GATEWAY_READ_TOKEN"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 -X POST "${GATEWAY_URL}/v1/ai/unified" -H "Authorization: Bearer ${GATEWAY_READ_TOKEN}" -H 'content-type: application/json' --data '{"task_id":"stage3","mode":"audit","instruction":"Return exactly: STAGE3_GATEWAY_AI_OK"}' | tee /tmp/unified.json
          jq -e '.ok == true and .engine == "cloudflare-workers-ai" and .production_mutation == false' /tmp/unified.json >/dev/null
          jq -e '.response | contains("STAGE3_GATEWAY_AI_OK")' /tmp/unified.json >/dev/null
          echo "Gateway/AI: PASS"

      - name: Direct Cloudflare Workers AI primary and fallback inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for model in '@cf/zai-org/glm-4.7-flash' '@cf/meta/llama-3.2-3b-instruct'; do
            response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 90 -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/${model}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"Return exactly STAGE3_AI_OK"}],"temperature":0,"max_tokens":64}')"
            printf '%s' "$response" | jq -e '.success == true and (.result.choices | length) == 1' >/dev/null
            printf '%s' "$response" | jq -e '.result.choices[0].message.content | contains("STAGE3_AI_OK")' >/dev/null
            echo "Workers AI ${model}: PASS"
          done

      - name: Password reset production E2E
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          login="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')")"
          token="$(printf '%s' "$login" | jq -r '.token // empty')"
          test -n "$token"
          rotate="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/recovery/rotate" -H "Authorization: Bearer ${token}" -H 'content-type: application/json' --data '{}')"
          code="$(printf '%s' "$rotate" | jq -r '.recoveryCode // empty')"
          test -n "$code"
          temporary="Stage3-${GITHUB_RUN_ID}-Reset!"
          curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/forgot-password" -H 'content-type: application/json' --data "$(jq -nc --arg c "$code" --arg p "$temporary" '{recoveryCode:$c,password:$p,confirm:$p}')" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg p "$temporary" '{password:$p}')" | jq -e '.ok == true and (.token | length > 0)' >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/forgot-password" -H 'content-type: application/json' --data "$(jq -nc --arg c "$code" --arg p "$ADMIN_PASSWORD" '{recoveryCode:$c,password:$p,confirm:$p}')" | jq -e '.ok == true' >/dev/null
          echo "Password reset: PASS"

      - name: R2 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          login="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')")"
          token="$(printf '%s' "$login" | jq -r '.token // empty')"
          test -n "$token"
          upload="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/media" -H "Authorization: Bearer ${token}" -H 'content-type: image/png' --data-binary 'STAGE3-R2')"
          key="$(printf '%s' "$upload" | jq -r '.key // empty')"
          test -n "$key"
          test "$(curl --silent --show-error --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' "${SITE_URL}/media/${key}")" = "200"
          test "$(curl --silent --show-error --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' -X DELETE "${SITE_URL}/media/${key}" -H "Authorization: Bearer ${token}")" = "200"
          test "$(curl --silent --show-error --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' "${SITE_URL}/media/${key}")" = "404"
          echo "R2: PASS"

      - name: Stage 3 core reconciliation summary
        run: |
          echo 'Stage 3 core current-lineage reconciliation: PASS'
          echo 'D1 CRUD: PASS'
          echo 'Gateway: PASS'
          echo 'Workers AI primary/fallback: PASS'
          echo 'Admin/Password Reset: PASS'
          echo 'R2: PASS'
