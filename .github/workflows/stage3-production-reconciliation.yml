name: Stage 3 Production Reconciliation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtra-production-e2e-single-queue
  cancel-in-progress: false

env:
  SITE_URL: https://phanthuanxtra.com
  GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev

jobs:
  reconcile:
    name: Current-lineage D1 Gateway AI Admin R2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Record lineage
        run: |
          set -euo pipefail
          echo "Stage 3 source SHA: ${GITHUB_SHA}"
          echo "Stage 3 ref: ${GITHUB_REF}"

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health /api/cars /admin.html; do
            status="$(curl --silent --show-error --retry 3 --max-time 20 -o /dev/null -w '%{http_code}' "${SITE_URL}${path}")"
            echo "${path} HTTP ${status}"
            test "$status" = "200"
          done

      - name: Admin authentication boundaries
        shell: bash
        run: |
          set -euo pipefail
          # Avoid deliberately consuming the production rate-limit budget on every merge.
          # Authentication correctness is covered by unit/contract tests; Stage 3 only verifies
          # that the protected dashboard remains inaccessible without credentials.
          status="$(curl --silent --show-error --max-time 20 -o /tmp/unauth.json -w '%{http_code}' "${SITE_URL}/api/admin/dashboard")"
          echo "Unauthenticated dashboard HTTP ${status}"
          test "$status" = "401"
          sleep 2

      - name: D1 CRUD production E2E
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          id="stage3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$payload")"
          test "$status" = "200"
          token="$(jq -r '.token // empty' /tmp/login.json)"
          test -n "$token"
          deleted=0
          cleanup_d1() {
            if [ "$deleted" -eq 1 ]; then return 0; fi
            for delay in 0 15 30 60 90; do
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
              status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}")" || true
              if [ "$status" = "200" ] || [ "$status" = "404" ]; then return 0; fi
              if [ "$status" != "429" ]; then return 0; fi
            done
          }
          trap cleanup_d1 EXIT
          create_payload="$(jq -nc --arg id "$id" --arg image "https://phanthuanxtra.com/media/vehicles/publish-admin-${id}.jpg" '{id:$id,brand:"PT XTRA STAGE3",model:"Runtime E2E",year:2026,mileage:1,price:1,fuel:"test",category:"suv",color:"test",status:"hidden",description:"temporary Stage 3 runtime evidence",features:["e2e"],images:[{url:$image}]}')"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/cars" -H "Authorization: Bearer ${token}" -H 'content-type: application/json' --data "$create_payload" | tee /tmp/create.json
          jq -e --arg id "$id" '.ok == true and .id == $id' /tmp/create.json >/dev/null

          read_ok=0
          for delay in 0 5 10 20 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            status="$(curl --silent --show-error --max-time 20 -o /tmp/read.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "${SITE_URL}/api/admin/cars")" || true
            echo "D1 READ attempt delay=${delay}s HTTP ${status}"
            if [ "$status" = "200" ]; then
              if jq -e --arg id "$id" '.cars | any(.[]; .id == $id)' /tmp/read.json >/dev/null; then
                read_ok=1
                break
              fi
              echo "D1 READ HTTP 200 but test record not visible yet; continuing reconciliation loop."
              continue
            fi
            if [ "$status" != "429" ] && [ "$status" != "000" ]; then
              cat /tmp/read.json >&2 || true
              exit 1
            fi
            echo "Cloudflare rate limit/timeout during D1 READ; backing off."
          done
          test "$read_ok" = "1"

          delete_ok=0
          for delay in 0 5 10 20 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            status="$(curl --silent --show-error --max-time 20 -o /tmp/delete.json -w '%{http_code}' -X DELETE "${SITE_URL}/api/admin/cars/${id}" -H "Authorization: Bearer ${token}")" || true
            echo "D1 DELETE attempt delay=${delay}s HTTP ${status}"
            if [ "$status" = "200" ]; then
              jq -e '.ok == true' /tmp/delete.json >/dev/null
              delete_ok=1
              deleted=1
              break
            fi
            if [ "$status" != "429" ]; then
              cat /tmp/delete.json >&2 || true
              exit 1
            fi
          done
          test "$delete_ok" = "1"
          echo "D1 CRUD: PASS"

      - name: Developer Gateway health and auth — no inference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --max-time 20 "${GATEWAY_URL}/health" | tee /tmp/gateway.json
          jq -e '.ok == true and .service == "developer-gateway" and .unified_ai == true and .unified_ai_engine == "cloudflare-workers-ai"' /tmp/gateway.json >/dev/null
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/gateway-unauth.json -w '%{http_code}' -X POST "${GATEWAY_URL}/v1/ai/unified" -H 'content-type: application/json' --data '{"instruction":"stage3 unauthorized"}')"
          test "$status" = "401"
          echo "Gateway health/auth: PASS — no Workers AI inference consumed"

      - name: Workers AI quota conservation
        run: |
          echo "::notice::Routine CI does not call Workers AI inference; daily allocation is reserved for real website customers."

      - name: Password reset isolation policy
        run: |
          echo "::notice::Routine Stage 3 does not mutate the live Admin password."
          echo "::notice::Full password-reset testing is isolated in Password Reset Production E2E and serialized through the shared production E2E queue."

      - name: R2 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          login="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg p "$ADMIN_PASSWORD" '{password:$p}')")"
          token="$(printf '%s' "$login" | jq -r '.token // empty')"
          test -n "$token"
          upload="$(curl --fail --silent --show-error --retry 2 --max-time 20 -X POST "${SITE_URL}/api/admin/media" -H "Authorization: Bearer ${token}" -H 'content-type: image/png' --data-binary 'STAGE3-R2')"
          key="$(printf '%s' "$upload" | jq -r '.key // empty')"
          test -n "$key"
          encoded_key="$(printf '%s' "$key" | jq -sRr @uri)"
          r2_request() {
            local method="$1" url="$2" out="$3" attempt=1 status
            while [ "$attempt" -le 4 ]; do
              if [ "$method" = "DELETE" ]; then
                status="$(curl --silent --show-error --max-time 30 -o "$out" -w '%{http_code}' -X DELETE "$url" -H "Authorization: Bearer ${token}")" || true
              else
                status="$(curl --silent --show-error --max-time 30 -o "$out" -w '%{http_code}' "$url")" || true
              fi
              echo "R2 ${method} attempt ${attempt} HTTP ${status}"
              if [ "$status" != "429" ]; then R2_LAST_STATUS="$status"; return 0; fi
              sleep $((attempt * 5)); attempt=$((attempt + 1))
            done
            R2_LAST_STATUS="429"; return 1
          }
          r2_request GET "${SITE_URL}/media/${encoded_key}" /tmp/r2-get-before-delete
          test "$R2_LAST_STATUS" = "200"
          r2_request DELETE "${SITE_URL}/media/${encoded_key}" /tmp/r2-delete
          test "$R2_LAST_STATUS" = "200"
          r2_request GET "${SITE_URL}/media/${encoded_key}" /tmp/r2-get-after-delete
          test "$R2_LAST_STATUS" = "404"
          echo "R2: PASS"

      - name: Stage 3 core reconciliation summary
        run: |
          echo 'Stage 3 core current-lineage reconciliation: PASS'
          echo 'D1 CRUD: PASS'
          echo 'Gateway: PASS'
          echo 'Workers AI inference: intentionally not consumed by CI; reserved for website customers'
          echo 'Admin auth boundary: PASS; password reset mutation isolated to dedicated E2E'
          echo 'R2: PASS'
