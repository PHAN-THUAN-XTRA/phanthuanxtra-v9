name: Free Security Operator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: free-security-operator
  cancel-in-progress: false

env:
  ZONE_NAME: phanthuanxtra.com
  D1_DATABASE_ID: 8b6c0fc8-c278-4797-9cfa-3ec93d0c1b7d
  SECURITY_OPERATOR_REPORT: security-operator-report.json

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      TELEGRAM_BACKUP_BOT_TOKEN: ${{ secrets.TELEGRAM_BACKUP_BOT_TOKEN }}
      TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}
      TELEGRAM_BACKUP_OWNER_ID: "6451516147"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run free-first security operator
        run: node scripts/security-operator.mjs

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-operator-${{ github.run_id }}
          path: security-operator-report.json
          retention-days: 7
          if-no-files-found: warn
