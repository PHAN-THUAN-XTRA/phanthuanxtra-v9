name: Production Asset Delivery Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  asset-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    name: Verify production asset delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check canonical recovery/admin assets
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://phanthuanxtra.com"
          check_asset() {
            local path="$1" marker="$2"
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 1 --max-time 20 \
              --location --proto '=https' --proto-redir '=https' \
              -o "$body" -w '%{http_code}' "$SITE_URL$path")"
            echo "$path final HTTP $status"
            test "$status" = "200"
            grep -Fq "$marker" "$body"
          }
          check_asset "/admin.html" "PHAN THUẦN XTRA"
          check_asset "/admin-recovery.html" "Admin Recovery"
          check_asset "/api/health" '"ok":true'

          # P4 public-flow regression: homepage structure + dynamic vehicle detail asset.
          home="$(mktemp)"
          curl --silent --show-error --compressed --retry 3 --max-time 20 "$SITE_URL/" -o "$home"
          for marker in 'id="cars-section"' 'id="test-drive"' 'id="ai-assistant"' 'id="contact"' 'id="compareModal"' 'id="aiWidget"'; do
            test "$(grep -Foc "$marker" "$home")" = "1"
          done
          test "$(grep -Foc '</main>' "$home")" = "1"
          test "$(grep -Foc '</html>' "$home")" = "1"
          check_asset "/car.html?id=__p4_missing__" "vehicleDetail"

          # Homepage Green Energy hero artwork must be publicly deliverable through the Worker.
          visual_headers="$(mktemp)"
          visual_body="$(mktemp)"
          visual_status="$(curl --silent --show-error --compressed --retry 3 --retry-delay 1 --max-time 20 \
            --location --proto '=https' --proto-redir '=https' \
            -D "$visual_headers" -o "$visual_body" -w '%{http_code}' \
            "$SITE_URL/media/editorial/green-energy/wide_clean_modern_promotional_banner_hero_image.png?asset_gate=$GITHUB_SHA")"
          echo "/media/editorial/green-energy/wide_clean_modern_promotional_banner_hero_image.png final HTTP $visual_status"
          test "$visual_status" = "200"
          grep -Eiq '^content-type:[[:space:]]*image/png' "$visual_headers"
          test -s "$visual_body"
          echo "Green Energy homepage PNG delivery PASS."
      - name: Verify editorial production UTF-8
        run: node scripts/verify-editorial-production.mjs
