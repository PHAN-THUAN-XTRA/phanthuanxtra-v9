name: Brevo Transactional Diagnostic

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: brevo-transactional-diagnostic
  cancel-in-progress: false

jobs:
  send-one-controlled-test:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SITE_URL: https://phanthuanxtra.com
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Verify runtime configuration and send one signed test
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v node >/dev/null
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::GitHub Actions ADMIN_PASSWORD secret is unavailable."
            exit 1
          fi

          endpoint="${SITE_URL}/api/admin/integrations/brevo/diagnostic"
          diagnostic_path="/api/admin/integrations/brevo/diagnostic"
          sign_request() {
            local method="$1"
            local ts nonce signature
            ts="$(date +%s)"
            nonce="$(cat /proc/sys/kernel/random/uuid)"
            export DIAG_METHOD="${method}" DIAG_TIMESTAMP="${ts}" DIAG_NONCE="${nonce}"
            signature="$(node -e '
              const { createHmac } = require("node:crypto");
              const parts = ["ptx-brevo-diagnostic-v1", process.env.DIAG_METHOD, "/api/admin/integrations/brevo/diagnostic", process.env.DIAG_TIMESTAMP, process.env.DIAG_NONCE];
              process.stdout.write(createHmac("sha256", process.env.ADMIN_PASSWORD).update(parts.join("\n")).digest("hex"));
            ')"
            signed_headers=(
              -H "X-PTX-Brevo-Timestamp: ${ts}"
              -H "X-PTX-Brevo-Nonce: ${nonce}"
              -H "X-PTX-Brevo-Signature: ${signature}"
            )
          }

          sign_request GET
          state_status="$(curl --silent --show-error --max-time 20 -o /tmp/brevo-state.json -w '%{http_code}' \
            "${signed_headers[@]}" "${endpoint}")"
          echo "Brevo configuration check: HTTP ${state_status}."
          if [ "${state_status}" != "200" ]; then
            echo "::error::Brevo diagnostic GET authorization failed (HTTP ${state_status}); no test email was sent."
            exit 1
          fi
          if ! jq -e '.ok==true and .configured==true and .api_key_present==true and .sender_valid==true and .recipient_valid==true' /tmp/brevo-state.json >/dev/null; then
            jq -c '{configured,api_key_present,sender_valid,recipient_valid,error}' /tmp/brevo-state.json
            echo "::error::Brevo Worker runtime configuration is incomplete; no test email was sent."
            exit 1
          fi
          echo "Brevo runtime binding presence: PASS (secret values not printed)."

          # Read-only provider probe isolates Cloudflare egress/DNS/TLS/API-key
          # failures before making any request that sends an email.
          sign_request GET
          probe_status="$(curl --silent --show-error --max-time 20 -o /tmp/brevo-account.json -w '%{http_code}' \
            "${signed_headers[@]}" "${endpoint}?probe=account")"
          echo "Brevo /v3/account probe endpoint: HTTP ${probe_status}."
          echo "Brevo account probe result (sanitized):"
          jq -c '{provider:{ok:.provider.ok,status:.provider.status,provider_code:.provider.provider_code,exception_type:.provider.exception_type,redirect_target:.provider.redirect_target,redirect_host:.provider.redirect_host},error}' /tmp/brevo-account.json
          if [ "${probe_status}" != "200" ] || ! jq -e '.ok==true and .provider.ok==true and .provider.status >= 200 and .provider.status < 300' /tmp/brevo-account.json >/dev/null; then
            echo "::error::Brevo account preflight failed. Cloudflare did not send any diagnostic email. Review the sanitized status above."
            exit 1
          fi

          sign_request POST
          result_status="$(curl --silent --show-error --max-time 25 -o /tmp/brevo-result.json -w '%{http_code}' \
            -X POST "${endpoint}" "${signed_headers[@]}" -H 'content-type: application/json' \
            --data '{"confirm":"send-one-brevo-test-email"}')"
          echo "Brevo diagnostic endpoint: HTTP ${result_status}."
          echo "Brevo provider result (sanitized):"
          jq -c '{ok,accepted_by_provider,status,provider_code,exception_type,message_id,test_id,error}' /tmp/brevo-result.json
          if [ "${result_status}" != "200" ]; then
            echo "::error::Brevo diagnostic reported failure (HTTP ${result_status})."
            exit 1
          fi
          jq -e '.ok == true and .accepted_by_provider == true and .status >= 200 and .status < 300' /tmp/brevo-result.json >/dev/null
          echo "Brevo API accepted one controlled diagnostic email; independent Gmail receipt is still required."

  read-only-egress-probe:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      SITE_URL: https://phanthuanxtra.com
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Read-only Brevo account egress check after deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_PASSWORD}"
          ts="$(date +%s)"
          nonce="$(cat /proc/sys/kernel/random/uuid)"
          export DIAG_METHOD=GET DIAG_TIMESTAMP="${ts}" DIAG_NONCE="${nonce}"
          signature="$(node -e '
            const {createHmac}=require("node:crypto");
            const parts=["ptx-brevo-diagnostic-v1","GET","/api/admin/integrations/brevo/diagnostic",process.env.DIAG_TIMESTAMP,process.env.DIAG_NONCE];
            process.stdout.write(createHmac("sha256",process.env.ADMIN_PASSWORD).update(parts.join("\n")).digest("hex"));
          ')"
          response_status="$(curl --silent --show-error --max-time 20 -o /tmp/brevo-readonly.json -w '%{http_code}' \
            -H "X-PTX-Brevo-Timestamp: ${ts}" -H "X-PTX-Brevo-Nonce: ${nonce}" \
            -H "X-PTX-Brevo-Signature: ${signature}" \
            "${SITE_URL}/api/admin/integrations/brevo/diagnostic?probe=account")"
          echo "Read-only Worker → Brevo account probe: HTTP ${response_status}."
          jq -c '{provider:{ok:.provider.ok,status:.provider.status,provider_code:.provider.provider_code,exception_type:.provider.exception_type,redirect_target:.provider.redirect_target,redirect_host:.provider.redirect_host},error}' /tmp/brevo-readonly.json
          if [ "${response_status}" != "200" ] || ! jq -e '.ok==true and .provider.ok==true' /tmp/brevo-readonly.json >/dev/null; then
            echo "::error::Worker Brevo outbound connectivity/authentication check failed. No email was sent."
            exit 1
          fi
          echo "Brevo Worker outbound account API check: PASS. No email sent."
