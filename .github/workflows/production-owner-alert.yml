name: Production Owner Alerts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/production-owner-alert.yml', 'scripts/production-owner-alert.mjs']
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['Deploy Cloudflare Worker', 'Production Smoke Gate-15', 'Production Asset Delivery Gate', 'Stage 3 Production Reconciliation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-private-owner-alerts
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch' ||
         github.event.workflow_run.event == 'workflow_run')))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Never execute code from a workflow_run head (including untrusted PRs).
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check production and notify verified private owner
        id: alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BACKUP_BOT_TOKEN: ${{ secrets.TELEGRAM_BACKUP_BOT_TOKEN }}
          TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}
        run: node scripts/production-owner-alert.mjs
      - name: Retain Telegram acknowledgment
        if: always() && steps.alert.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alert.outputs.artifact_name }}
          path: production-alert-receipt.json
          retention-days: 30
      - name: Retain public health evidence
        if: always() && github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          if-no-files-found: warn
          retention-days: 7
