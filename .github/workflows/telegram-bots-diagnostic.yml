name: Telegram Bots Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-diagnostics:
    name: Check Auto + VIP Telegram bots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_AUTO_BOT_TOKEN: ${{ secrets.TELEGRAM_AUTO_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIP_BOT_TOKEN: ${{ secrets.TELEGRAM_VIP_BOT_TOKEN }}

    steps:
      - name: Check secret presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TELEGRAM_AUTO_BOT_TOKEN:-}" ]] || { echo "❌ Auto Bot token is missing (checked TELEGRAM_AUTO_BOT_TOKEN, then TELEGRAM_BOT_TOKEN)"; exit 1; }
          [[ -n "${TELEGRAM_VIP_BOT_TOKEN:-}" ]] || { echo "❌ TELEGRAM_VIP_BOT_TOKEN is missing"; exit 1; }
          echo "✅ Both Telegram bot tokens are available to diagnostics."

      - name: Check Telegram identity and webhook state
        shell: bash
        run: |
          set -euo pipefail

          check_bot() {
            local label="$1"
            local token="$2"
            local expected_path="$3"
            local expected_username="$4"

            echo ""
            echo "===== $label ====="

            me="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${token}/getMe")"
            if ! printf '%s' "$me" | jq -e '.ok == true' >/dev/null; then
              echo "❌ getMe failed"
              printf '%s\n' "$me" | jq -r '.description // "Unknown Telegram API error"'
              return 1
            fi

            bot_id="$(printf '%s' "$me" | jq -r '.result.id // empty')"
            username="$(printf '%s' "$me" | jq -r '.result.username // empty')"
            first_name="$(printf '%s' "$me" | jq -r '.result.first_name // empty')"
            echo "Telegram API: ✅ ok=true"
            echo "Bot ID: ${bot_id:-unknown}"
            echo "Username: ${username:-unknown}"
            echo "First name: ${first_name:-unknown}"

            if [[ "${username,,}" == "${expected_username,,}" ]]; then
              echo "✅ Identity matches expected bot: $expected_username"
            else
              echo "❌ Identity mismatch. Expected: $expected_username"
              return 1
            fi

            info="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${token}/getWebhookInfo")"
            if ! printf '%s' "$info" | jq -e '.ok == true' >/dev/null; then
              echo "❌ getWebhookInfo failed"
              printf '%s\n' "$info" | jq -r '.description // "Unknown Telegram API error"'
              return 1
            fi

            actual_url="$(printf '%s' "$info" | jq -r '.result.url // empty')"
            pending="$(printf '%s' "$info" | jq -r '.result.pending_update_count // 0')"
            last_error="$(printf '%s' "$info" | jq -r '.result.last_error_message // empty')"

            if [[ -z "$actual_url" ]]; then
              echo "⚠️ Webhook is not configured. Expected path: $expected_path"
            elif [[ "$actual_url" == *"$expected_path" ]]; then
              echo "✅ Webhook path matches: $expected_path"
            else
              echo "⚠️ Webhook URL does not match expected path: $expected_path"
            fi

            echo "Pending updates: $pending"
            if [[ "$pending" == "0" ]]; then echo "✅ No pending Telegram updates."; else echo "⚠️ Telegram has pending update(s)."; fi
            if [[ -n "$last_error" ]]; then echo "⚠️ Telegram webhook error: $last_error"; else echo "✅ No recent Telegram webhook error reported."; fi
          }

          check_bot "AUTO BOT" "$TELEGRAM_AUTO_BOT_TOKEN" "/api/telegram/webhook" "phanthuanxtra_auto_bot"
          check_bot "VIP BOT" "$TELEGRAM_VIP_BOT_TOKEN" "/api/telegram/vip-webhook" "phanthuanxtra_vip_bot"

      - name: Safety confirmation
        run: |
          echo "✅ Diagnostic only: no Cloudflare deploy, no D1 migration, no setWebhook, no secret mutation."
