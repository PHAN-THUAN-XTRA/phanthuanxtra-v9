name: Telegram Bots Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-diagnostics:
    name: Audit production Telegram bot roles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_AUTO_BOT_TOKEN: ${{ secrets.TELEGRAM_AUTO_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIP_BOT_TOKEN: ${{ secrets.TELEGRAM_VIP_BOT_TOKEN }}
      TELEGRAM_CRM_BOT_TOKEN: ${{ secrets.TELEGRAM_CRM_BOT_TOKEN }}
      TELEGRAM_CRM_CHAT_ID: ${{ secrets.TELEGRAM_CRM_CHAT_ID }}
      TELEGRAM_CHAT_BOT_TOKEN: ${{ secrets.TELEGRAM_CHAT_BOT_TOKEN }}
      TELEGRAM_BACKUP_BOT_TOKEN: ${{ secrets.TELEGRAM_BACKUP_BOT_TOKEN }}
      TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}

    steps:
      - name: Check secret presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TELEGRAM_AUTO_BOT_TOKEN:-}" ]] || { echo "❌ Auto Bot token is missing (checked TELEGRAM_AUTO_BOT_TOKEN, then TELEGRAM_BOT_TOKEN)"; exit 1; }
          [[ -n "${TELEGRAM_VIP_BOT_TOKEN:-}" ]] || { echo "❌ TELEGRAM_VIP_BOT_TOKEN is missing"; exit 1; }
          [[ -n "${TELEGRAM_CRM_BOT_TOKEN:-}" ]] || { echo "❌ CRM Bot token is missing"; exit 1; }
          [[ -n "${TELEGRAM_CRM_CHAT_ID:-}" ]] || { echo "❌ CRM Chat ID is missing"; exit 1; }
          echo "✅ Required production Telegram tokens (Auto, VIP, CRM) are available."
          if [[ -n "${TELEGRAM_CHAT_BOT_TOKEN:-}" ]]; then echo "ℹ️ Separate AI Chat Bot token is configured."; else echo "ℹ️ Separate AI Chat Bot token is NOT configured; website AI remains independent of Telegram."; fi

      - name: Check Telegram identity and webhook state
        shell: bash
        run: |
          set -euo pipefail

          check_bot() {
            local label="$1"
            local token="$2"
            local expected_path="$3"
            local expected_username="$4"

            echo ""
            echo "===== $label ====="

            me="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${token}/getMe")"
            if ! printf '%s' "$me" | jq -e '.ok == true' >/dev/null; then
              echo "❌ getMe failed"
              printf '%s\n' "$me" | jq -r '.description // "Unknown Telegram API error"'
              return 1
            fi

            bot_id="$(printf '%s' "$me" | jq -r '.result.id // empty')"
            username="$(printf '%s' "$me" | jq -r '.result.username // empty')"
            first_name="$(printf '%s' "$me" | jq -r '.result.first_name // empty')"
            echo "Telegram API: ✅ ok=true"
            echo "Bot ID: ${bot_id:-unknown}"
            echo "Username: ${username:-unknown}"
            echo "First name: ${first_name:-unknown}"

            if [[ "${username,,}" == "${expected_username,,}" ]]; then
              echo "✅ Identity matches expected bot: $expected_username"
            else
              echo "❌ Identity mismatch. Expected: $expected_username"
              return 1
            fi

            info="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${token}/getWebhookInfo")"
            if ! printf '%s' "$info" | jq -e '.ok == true' >/dev/null; then
              echo "❌ getWebhookInfo failed"
              printf '%s\n' "$info" | jq -r '.description // "Unknown Telegram API error"'
              return 1
            fi

            actual_url="$(printf '%s' "$info" | jq -r '.result.url // empty')"
            pending="$(printf '%s' "$info" | jq -r '.result.pending_update_count // 0')"
            last_error="$(printf '%s' "$info" | jq -r '.result.last_error_message // empty')"

            if [[ -z "$actual_url" ]]; then
              echo "⚠️ Webhook is not configured. Expected path: $expected_path"
            elif [[ "$actual_url" == *"$expected_path" ]]; then
              echo "✅ Webhook path matches: $expected_path"
            else
              echo "⚠️ Webhook URL does not match expected path: $expected_path"
            fi

            echo "Pending updates: $pending"
            if [[ "$pending" == "0" ]]; then echo "✅ No pending Telegram updates."; else echo "⚠️ Telegram has pending update(s)."; fi
            if [[ -n "$last_error" ]]; then echo "⚠️ Telegram webhook error: $last_error"; else echo "✅ No recent Telegram webhook error reported."; fi
          }

          check_bot "AUTO BOT" "$TELEGRAM_AUTO_BOT_TOKEN" "/api/telegram/webhook" "phanthuanxtra_auto_bot"
          check_bot "VIP BOT" "$TELEGRAM_VIP_BOT_TOKEN" "/api/telegram/vip-webhook" "phanthuanxtra_vip_bot"

          echo ""
          echo "===== CRM BOT ====="
          crm_me="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${TELEGRAM_CRM_BOT_TOKEN}/getMe")"
          printf '%s' "$crm_me" | jq -e '.ok == true' >/dev/null
          echo "Telegram API: ✅ ok=true"
          echo "Bot ID: $(printf '%s' "$crm_me" | jq -r '.result.id // "unknown"')"
          echo "Username: $(printf '%s' "$crm_me" | jq -r '.result.username // "unknown"')"
          crm_chat="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 -H 'Content-Type: application/json' --data "$(jq -nc --arg chat_id "$TELEGRAM_CRM_CHAT_ID" '{chat_id:$chat_id}')" "https://api.telegram.org/bot${TELEGRAM_CRM_BOT_TOKEN}/getChat")"
          printf '%s' "$crm_chat" | jq -e '.ok == true' >/dev/null
          echo "CRM destination: ✅ accessible; type=$(printf '%s' "$crm_chat" | jq -r '.result.type // "unknown"')"

          echo ""
          echo "===== BACKUP BOT ====="
          [[ -n "${TELEGRAM_BACKUP_BOT_TOKEN:-}" ]] || { echo "❌ TELEGRAM_BACKUP_BOT_TOKEN is missing"; exit 1; }
          [[ -n "${TELEGRAM_BACKUP_CHAT_ID:-}" ]] || { echo "❌ TELEGRAM_BACKUP_CHAT_ID is missing"; exit 1; }
          backup_me="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/getMe")"
          printf '%s' "$backup_me" | jq -e '.ok == true' >/dev/null
          echo "Telegram API: ✅ ok=true"
          echo "Bot ID: $(printf '%s' "$backup_me" | jq -r '.result.id // "unknown"')"
          echo "Username: $(printf '%s' "$backup_me" | jq -r '.result.username // "unknown"')"
          backup_chat="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 -H 'Content-Type: application/json' --data "$(jq -nc --arg chat_id "$TELEGRAM_BACKUP_CHAT_ID" '{chat_id:$chat_id}')" "https://api.telegram.org/bot${TELEGRAM_BACKUP_BOT_TOKEN}/getChat")"
          printf '%s' "$backup_chat" | jq -e '.ok == true' >/dev/null
          echo "Backup destination: ✅ accessible; type=$(printf '%s' "$backup_chat" | jq -r '.result.type // "unknown"')"

          if [[ -n "${TELEGRAM_CHAT_BOT_TOKEN:-}" ]]; then
            echo ""
            echo "===== OPTIONAL SEPARATE AI CHAT BOT ====="
            chat_me="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${TELEGRAM_CHAT_BOT_TOKEN}/getMe")"
            printf '%s' "$chat_me" | jq -e '.ok == true' >/dev/null
            echo "Telegram API: ✅ ok=true"
            echo "Bot ID: $(printf '%s' "$chat_me" | jq -r '.result.id // "unknown"')"
            echo "Username: $(printf '%s' "$chat_me" | jq -r '.result.username // "unknown"')"
            chat_info="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --request POST --url "https://api.telegram.org/bot${TELEGRAM_CHAT_BOT_TOKEN}/getWebhookInfo")"
            echo "Webhook configured: $(printf '%s' "$chat_info" | jq -r '(.result.url // "") | length > 0')"
            echo "Pending updates: $(printf '%s' "$chat_info" | jq -r '.result.pending_update_count // 0')"
          fi

          auto_id="$(curl --silent "https://api.telegram.org/bot${TELEGRAM_AUTO_BOT_TOKEN}/getMe" | jq -r '.result.id // empty')"
          vip_id="$(curl --silent "https://api.telegram.org/bot${TELEGRAM_VIP_BOT_TOKEN}/getMe" | jq -r '.result.id // empty')"
          crm_id="$(printf '%s' "$crm_me" | jq -r '.result.id // empty')"
          backup_id="$(printf '%s' "$backup_me" | jq -r '.result.id // empty')"
          chat_id=""
          if [[ -n "${TELEGRAM_CHAT_BOT_TOKEN:-}" ]]; then chat_id="$(printf '%s' "$chat_me" | jq -r '.result.id // empty')"; fi
          printf "Distinct configured bot IDs: "; printf "%s\n" "$auto_id" "$vip_id" "$crm_id" "$chat_id" | sed '/^$/d' | sort -u | wc -l

      - name: Safety confirmation
        run: |
          echo "✅ Diagnostic only: no Cloudflare deploy, no D1 migration, no setWebhook, no secret mutation."
