name: Business Jets CRM Production E2E

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SITE_URL: https://phanthuanxtra.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Checkout deployed revision for Admin session signing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify public Business Jets form path, D1 and Telegram CRM
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN"

          session_token="$(node --input-type=module -e 'import {issueAdminToken} from "./src/admin-auth.js"; process.stdout.write(await issueAdminToken({ADMIN_TOKEN:process.env.ADMIN_TOKEN}));')"
          test -n "$session_token"

          marker="CI-BUSINESS-JETS-${GITHUB_RUN_ID}"
          visitor_id="ci_business_jets_${GITHUB_RUN_ID}"
          idempotency_key="ci-business-jets-${GITHUB_RUN_ID}"
          message="Business Jets / Private Aviation | Điểm đi: TP.HCM | Điểm đến: Đà Nẵng | Ngày/giờ: 2026-10-07 09:00 | Số khách: 4 | Hành lý: 2 kiện | $marker"
          payload="$(jq -nc --arg name "$marker" --arg message "$message" --arg visitor_id "$visitor_id" '{source:"business-jets",name:$name,phone:"0900000000",car_id:"",message:$message,visitor_id:$visitor_id}')"

          cleanup_marker() {
            curl --fail-with-body --silent --show-error --max-time 30 \
              "$SITE_URL/api/admin/leads" \
              -H "Authorization: Bearer $session_token" > /tmp/jet-cleanup.json || return 0
            jq -r --arg marker "$marker" '.leads[] | select(.name == $marker) | .id' /tmp/jet-cleanup.json | while read -r id; do
              test -z "$id" && continue
              curl --fail-with-body --silent --show-error --max-time 30 -X DELETE \
                "$SITE_URL/api/admin/leads" \
                -H "Authorization: Bearer $session_token" \
                -H 'content-type: application/json' \
                --data "$(jq -nc --argjson id "$id" '{id:$id}')" | jq -e '.deleted == true' >/dev/null
            done
          }
          trap cleanup_marker EXIT
          cleanup_marker

          echo "Deploy run ${{ github.event.workflow_run.id }} SHA ${{ github.event.workflow_run.head_sha }}"

          # This request intentionally has NO Authorization header. It mirrors public/script.js.
          public_status="$(curl --silent --show-error --max-time 60 -o /tmp/jet-public.json -w '%{http_code}' \
            -X POST "$SITE_URL/api/leads" \
            -H 'content-type: application/json' \
            -H "Idempotency-Key: $idempotency_key" \
            --data "$payload")"
          test "$public_status" = "200"
          jq -e '.ok == true and .stored == true and .replayed == false and (has("lead_id") | not)' /tmp/jet-public.json >/dev/null
          echo "Public unauthenticated Business Jets form submission: PASS"

          # Replay the exact request with Admin auth to inspect the durable result without creating a second lead.
          replay_status="$(curl --silent --show-error --max-time 60 -o /tmp/jet-replay.json -w '%{http_code}' \
            -X POST "$SITE_URL/api/leads" \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Idempotency-Key: $idempotency_key" \
            --data "$payload")"
          test "$replay_status" = "200"
          jq -e '.ok == true and .stored == true and .replayed == true and (.lead_id|type)=="number" and .delivery.ok == true' /tmp/jet-replay.json >/dev/null
          lead_id="$(jq -r '.lead_id' /tmp/jet-replay.json)"

          curl --fail-with-body --silent --show-error --max-time 30 \
            "$SITE_URL/api/admin/leads" \
            -H "Authorization: Bearer $session_token" > /tmp/jet-leads.json
          jq -e --argjson id "$lead_id" --arg marker "$marker" \
            '.leads[] | select(.id == $id and .name == $marker and .phone == "0900000000" and (.message|contains("TP.HCM")) and (.message|contains("Đà Nẵng")) and (.message|contains("2026-10-07 09:00")) and (.message|contains("Số khách: 4")) and (.message|contains("Hành lý: 2 kiện")))' \
            /tmp/jet-leads.json >/dev/null

          echo "Business Jets public form -> D1 lead $lead_id -> Telegram delivery: PASS"
          cleanup_marker
          trap - EXIT
          echo "Synthetic lead cleanup: PASS"
