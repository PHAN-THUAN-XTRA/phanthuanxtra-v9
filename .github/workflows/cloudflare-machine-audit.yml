name: Cloudflare Machine Inventory Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-machine-audit
  cancel-in-progress: false

env:
  WORKER_NAME: phanthuanxtra-v2
  ZONE_NAME: phanthuanxtra.com

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Run read-only Cloudflare inventory
        run: node scripts/cloudflare-machine-audit.mjs

      - name: Verify report contract, Queue invariants, and redaction
        run: |
          set -euo pipefail
          jq -e '
            .audit=="CF-MACHINE-010"
            and .mutations==0
            and (.worker_dependencies|length)==6
            and (.worker_dependencies["phanthuanxtra-videos"] == null)
            and .phase2_evidence.public_probes.videos_public.status==200
            and .phase2_evidence.public_probes.videos_v2_workers_dev.status==200
            and .phase2_evidence.public_json_shapes.images_health.status==200
            and (.worker_dependencies["phanthuanxtra-v2"].bindings | any(.name=="VEHICLE_JOBS" and .type=="queue" and .queue_name=="ptx-vehicle-jobs"))
            and (.queue_evidence["ptx-vehicle-jobs"] != null)
            and (.queue_evidence["ptx-vehicle-jobs-dlq"] != null)
            and ((.queue_evidence["ptx-vehicle-jobs"].consumers // []) | length)==1
            and ((.queue_evidence["ptx-vehicle-jobs"].consumers // []) | any(
              .dead_letter_queue=="ptx-vehicle-jobs-dlq"
              and (.settings.batch_size|tonumber)==1
              and (.settings.max_retries|tonumber)==5
            ))
            and ((.queue_evidence["ptx-vehicle-jobs"].producers // []) | any(.script=="phanthuanxtra-v2"))
          ' cloudflare-audit/report.json >/dev/null

          node - <<'NODE'
          const report=require('./cloudflare-audit/report.json');
          const bad=[];
          function walk(x,path=[]){
            if(Array.isArray(x)) return x.forEach((v,i)=>walk(v,[...path,i]));
            if(!x||typeof x!=='object') return;
            const sensitive=x.type==='secret_text'||/secret|token|password|private.?key|api.?key|recovery/i.test(String(x.name||''));
            if(sensitive){
              for(const k of ['text','value']) if(k in x && x[k] !== '[REDACTED]') bad.push([...path,k].join('.'));
            }
            for(const [k,v] of Object.entries(x)) walk(v,[...path,k]);
          }
          walk(report);
          if(bad.length) throw new Error('Sensitive binding value escaped redaction');
          console.log('Sensitive binding redaction: PASS');
          NODE

          jq '{
            audit,generated_at,mutations,production,
            worker_dependency_count:(.worker_dependencies|length),
            workers:(.worker_dependencies|keys),
            service_bindings,
            queues:.queue_evidence,
            d1_schemas,
            phase2_evidence,
            blocked:.decisions.blocked
          }' cloudflare-audit/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-machine-audit-v10-${{ github.run_id }}
          path: cloudflare-audit/report.json
          retention-days: 30
          if-no-files-found: error
