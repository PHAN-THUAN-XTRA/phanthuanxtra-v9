name: Cloudflare Machine Inventory Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-machine-audit.yml
      - scripts/cloudflare-machine-audit.mjs

permissions:
  contents: read

concurrency:
  group: cloudflare-machine-audit
  cancel-in-progress: false

env:
  WORKER_NAME: phanthuanxtra-v2
  ZONE_NAME: phanthuanxtra.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BACKUP_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Run read-only Cloudflare inventory
        run: node scripts/cloudflare-machine-audit.mjs
      - name: Verify report contract and redaction
        run: |
          set -euo pipefail
          jq -e '.audit=="CF-MACHINE-003" and .mutations==0' cloudflare-audit/report.json >/dev/null
          node - <<'NODE'
          const report=require('./cloudflare-audit/report.json');
          const bad=[];
          function walk(x,path=[]){
            if(Array.isArray(x)) return x.forEach((v,i)=>walk(v,[...path,i]));
            if(!x||typeof x!=='object') return;
            const sensitive=x.type==='secret_text'||/secret|token|password|private.?key|api.?key|recovery/i.test(String(x.name||''));
            if(sensitive){
              for(const k of ['text','value']) if(k in x && x[k] !== '[REDACTED]') bad.push([...path,k].join('.'));
            }
            for(const [k,v] of Object.entries(x)) walk(v,[...path,k]);
          }
          walk(report);
          if(bad.length) throw new Error('Sensitive binding value escaped redaction');
          console.log('Sensitive binding redaction: PASS');
          NODE
          jq '{audit,generated_at,mutations,production,source_evidence,decisions,availability:(.resources|map_values({unavailable:(.unavailable//false),status:(.status//null)})),worker_dependency_count:(.worker_dependencies|length)}' cloudflare-audit/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-machine-audit-${{ github.run_id }}
          path: cloudflare-audit/report.json
          retention-days: 30
          if-no-files-found: error
