name: Security Incident Investigator

on:
  workflow_run:
    workflows: ["Free Security Operator"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: security-incident-investigator
  cancel-in-progress: false

env:
  SECURITY_OPERATOR_REPORT: security-operator-report.json
  INCIDENT_INVESTIGATION_REPORT: incident-investigation.json

jobs:
  investigate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TELEGRAM_BACKUP_BOT_TOKEN: ${{ secrets.TELEGRAM_BACKUP_BOT_TOKEN }}
      TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}
      TELEGRAM_BACKUP_OWNER_ID: "6451516147"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 20

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download triggering security evidence
        uses: actions/download-artifact@v8
        with:
          name: security-operator-${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify investigator trigger
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('security-operator-report.json','utf8'));
          const f=Array.isArray(r.findings)?r.findings:[];
          const n=Array.isArray(r.notifications)?r.notifications:[];
          const rank={high:1,critical:2};
          const highest=f.reduce((a,x)=>(rank[x.severity]||0)>(rank[a]||0)?x.severity:a,'none');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'incident_count='+n.length+'\nhighest_severity='+highest+'\n');
          NODE

      - name: Build bounded incident investigation
        id: investigation
        if: ${{ steps.classify.outputs.incident_count != '0' }}
        run: node scripts/incident-investigator.mjs

      - name: Prepare deterministic draft remediation
        id: remediation
        if: ${{ steps.classify.outputs.incident_count != '0' && steps.investigation.outputs.candidate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.investigation.outputs.target_sha }}
          BRANCH: ${{ steps.investigation.outputs.branch }}
          INCIDENT_ID: ${{ steps.investigation.outputs.incident_id }}
        shell: bash
        run: |
          set -u
          git config user.name 'phanthuanxtra-security[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          existing_url="$(gh pr list --state all --head "$BRANCH" --json url --jq '.[0].url // ""' 2>/dev/null || true)"
          if [ -n "$existing_url" ]; then
            echo "status=existing-draft-pr" >> "$GITHUB_OUTPUT"
            echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "$BRANCH"
          if ! git revert --no-edit "$TARGET_SHA"; then
            git revert --abort >/dev/null 2>&1 || true
            echo "status=revert-preparation-failed" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npm test || ! npm run check; then
            echo "status=remediation-tests-failed" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git push --set-upstream origin "$BRANCH"; then
            echo "status=remediation-branch-push-failed" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > incident-pr-body.md <<EOF
          Automated bounded remediation candidate for $INCIDENT_ID.

          This draft only proposes reverting the latest recent single-parent main commit after a CRITICAL code-runtime signal.

          Safety gates:
          - Draft PR only; never auto-merged.
          - Production rollback/deploy is not invoked by this workflow.
          - WAF/firewall, secrets, billing and data are untouched.
          - Full repository tests and npm check passed before push.

          Owner review is required before merge.
          EOF

          pr_url="$(gh pr create --draft --base main --head "$BRANCH"             --title "fix(security): draft revert ${TARGET_SHA:0:10} after critical incident"             --body-file incident-pr-body.md 2>/dev/null || true)"
          if [ -z "$pr_url" ]; then
            echo "status=remediation-pr-create-failed" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=created-draft-pr" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Notify owner about remediation candidate
        if: ${{ steps.classify.outputs.incident_count != '0' && steps.investigation.outputs.candidate == 'true' }}
        env:
          REMEDIATION_STATUS: ${{ steps.remediation.outputs.status }}
          REMEDIATION_PR_URL: ${{ steps.remediation.outputs.pr_url }}
        run: node scripts/security-remediation-notify.mjs

      - name: Notify owner about report-only investigation
        if: ${{ steps.classify.outputs.incident_count != '0' && steps.investigation.outputs.candidate != 'true' }}
        env:
          REMEDIATION_STATUS: report-only-no-safe-code-remediation
          REMEDIATION_PR_URL: ""
        run: node scripts/security-remediation-notify.mjs

      - name: Upload incident investigation evidence
        if: ${{ always() && steps.classify.outputs.incident_count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: incident-investigation-${{ github.event.workflow_run.id }}
          path: incident-investigation.json
          retention-days: 30
          if-no-files-found: warn
