name: QUEUE-01 Production E2E Origin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BASE_URL: https://phanthuanxtra-v2.phanthuanmodelactor.workers.dev
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Admin 200 + signed session + dashboard + D1 CRUD + R2 write/read/delete
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          TEST_CAR_ID="ci-origin-e2e-${GITHUB_RUN_ID}"
          export TEST_CAR_ID
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "$BASE_URL/api/admin/login" -H 'content-type: application/json' --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          echo "Worker-origin Admin login HTTP $status"
          test "$status" = "200"
          SESSION="$(jq -r '.token // empty' /tmp/login.json)"
          test "$SESSION" != ""
          printf '%s' "$SESSION" | grep -Eq '^ptx1\.[0-9]+\.[a-f0-9]{32}\.[A-Za-z0-9_-]+$'
          echo 'Admin signed session: ptx1 HMAC token shape verified'
          cleanup() {
            curl --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/cars/$TEST_CAR_ID" -H "Authorization: Bearer $SESSION" >/dev/null || true
            if [ -n "${MEDIA_KEY:-}" ]; then
              curl --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/media/$MEDIA_KEY" -H "Authorization: Bearer $SESSION" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/dashboard" | tee /tmp/dashboard.json
          jq -e '.stats and (.stats.cars|type == "number")' /tmp/dashboard.json >/dev/null
          echo 'Authenticated dashboard: OK'
          TEST_IMAGE_URL="https://phanthuanxtra.com/media/vehicles/publish-admin-${TEST_CAR_ID}.jpg"
          export TEST_IMAGE_URL
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X POST "$BASE_URL/api/admin/cars" -H "Authorization: Bearer $SESSION" -H 'content-type: application/json' --data "{\"id\":\"$TEST_CAR_ID\",\"brand\":\"PT XTRA TEST\",\"model\":\"CI E2E Origin\",\"year\":2026,\"mileage\":1,\"price\":1,\"fuel\":\"test\",\"category\":\"suv\",\"color\":\"test\",\"status\":\"available\",\"description\":\"Queue-01 production E2E; automatically deleted.\",\"features\":[\"e2e\"],\"images\":[\"$TEST_IMAGE_URL\"]}" | tee /tmp/create.json
          jq -e '.ok == true and .id == env.TEST_CAR_ID' /tmp/create.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/cars/$TEST_CAR_ID" | tee /tmp/read-one.json
          jq -e --arg id "$TEST_CAR_ID" '.car.id == $id and .car.brand == "PT XTRA TEST"' /tmp/read-one.json >/dev/null
          echo 'D1 CRUD create/read: OK'
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/cars/$TEST_CAR_ID" -H "Authorization: Bearer $SESSION" | tee /tmp/delete.json
          jq -e '.ok == true and .deleted == env.TEST_CAR_ID' /tmp/delete.json >/dev/null
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/read-after-delete.json -w '%{http_code}' -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/cars/$TEST_CAR_ID")"
          echo "D1 read after delete HTTP $status"
          test "$status" = "404"
          echo 'D1 CRUD delete: OK'
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/xtra-e2e.png
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-upload.json -w '%{http_code}' -X POST "$BASE_URL/api/admin/media" -H "Authorization: Bearer $SESSION" -H 'content-type: image/png' --data-binary @/tmp/xtra-e2e.png)"
          echo "R2 write/upload HTTP $status"
          test "$status" = "200"
          MEDIA_KEY="$(jq -r '.key // empty' /tmp/media-upload.json)"
          test -n "$MEDIA_KEY"
          export MEDIA_KEY
          npx --no-install wrangler r2 object get "phanthuanxtra-media/$MEDIA_KEY" --remote --file=/tmp/r2-direct.png >/tmp/r2-direct.log
          cmp /tmp/xtra-e2e.png /tmp/r2-direct.png
          echo 'R2 direct bucket read-after-write: OK'
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 "$BASE_URL/media/$MEDIA_KEY" -o /tmp/read.png
          cmp /tmp/xtra-e2e.png /tmp/read.png
          echo 'R2 Worker route write/read: OK'
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-delete.json -w '%{http_code}' -X DELETE "$BASE_URL/api/admin/media/$MEDIA_KEY" -H "Authorization: Bearer $SESSION")"
          echo "R2 delete HTTP $status"
          test "$status" = "200"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-after.json -w '%{http_code}' "$BASE_URL/media/$MEDIA_KEY")"
          echo "R2 read after delete HTTP $status"
          test "$status" = "404"
          echo 'QUEUE-01 PRODUCTION E2E: ADMIN 200 + SIGNED SESSION + DASHBOARD + D1 CRUD + R2 WRITE/READ/DELETE = PASS'
