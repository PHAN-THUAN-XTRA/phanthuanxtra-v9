name: Gate 11 APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/gate11-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Production App API smoke test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 20 https://phanthuanxtra.com/api/app/v1/health)"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .service == "app-api"' >/dev/null

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: AI contract regression tests
        working-directory: .
        shell: bash
        run: node --test tests/ai-chat-contract.test.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          echo "APK_SIZE=$(stat -c%s "$apk")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-gate11-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: apk-gate11-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/app-debug.apk.sha256 \
            --title "Gate 11 APK #${{ github.run_number }}" \
            --notes "Gate 11 direct APK. Source: $GITHUB_SHA. Physical S21 Ultra regression remains required before Gate 11 GREEN."
          echo "Direct APK: https://github.com/PHAN-THUAN-XTRA/phanthuanxtra-v9/releases/download/$RELEASE_TAG/app-debug.apk"
          echo "SHA-256: https://github.com/PHAN-THUAN-XTRA/phanthuanxtra-v9/releases/download/$RELEASE_TAG/app-debug.apk.sha256"
