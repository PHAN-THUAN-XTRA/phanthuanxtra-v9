name: AI Unified Executor

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Task to execute from the canonical project checkpoint'
        required: true
        type: string
      task_id:
        description: 'Stable task/checkpoint ID'
        required: true
        type: string
      base_branch:
        description: 'Non-main branch containing the checkpoint to continue'
        required: true
        type: string
        default: feature/multi-ai-developer-gateway

# One execution queue: different task IDs must not execute concurrently.
concurrency:
  group: ai-unified-executor-single-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unified-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout checkpoint
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare executor environment
        env:
          TASK_ID: ${{ inputs.task_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          test "$BASE_BRANCH" != "main"
          test -n "$TASK_ID"
          printf '%s\n' "$TASK_ID" > .ai-unified-task-id
          node --version
          git status --short

      - name: Read canonical project checkpoint
        run: |
          set -euo pipefail
          test -s MASTER_PROJECT_STATUS.md
          printf 'Canonical checkpoint: MASTER_PROJECT_STATUS.md\n'
          wc -c MASTER_PROJECT_STATUS.md

      - name: Run unified Cloudflare Workers AI executor
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          MULTI_AI_INSTRUCTION: ${{ inputs.instruction }}
          GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
          UNIFIED_AI_GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev
          TASK_CHECKPOINT: ''
        run: |
          set -euo pipefail
          export TASK_CHECKPOINT="$(cat MASTER_PROJECT_STATUS.md)"
          node developer-gateway/ai-peer-executor.mjs > ai-unified-executor.json
          node -e "const x=require('./ai-unified-executor.json'); if(x.production_mutation!==false) throw new Error('production mutation must remain false'); if(x.logical_agent!=='xtra-unified-ai') throw new Error('wrong logical agent'); if(x.engine!=='cloudflare-workers-ai') throw new Error('wrong inference engine'); if(!x.response) throw new Error('missing unified response');"
          test -s ai-unified-executor.json

      - name: Safety and regression gate
        run: |
          set -euo pipefail
          if grep -nE '(^|/)(\.env($|\.)|credentials|secrets?)(/|$)' ai-unified-executor.json; then
            echo 'Potential secret material detected; refusing result.'
            exit 1
          fi
          node --check developer-gateway/ai-peer-executor.mjs
          node --check developer-gateway/multi-ai-review.mjs
          node --check developer-gateway/src/index.js
          git diff --check

      - name: Executor summary
        if: always()
        env:
          TASK_ID: ${{ inputs.task_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          {
            echo '# AI Unified Executor'
            echo
            echo 'logical_agent=xtra-unified-ai'
            echo 'inference_engine=cloudflare-workers-ai'
            printf 'task_id=%s\n' "$TASK_ID"
            printf 'base_branch=%s\n' "$BASE_BRANCH"
            echo '- Single execution queue: **enabled**'
            echo '- Independent peer API calls: **0**'
            echo '- Repository writes: **none**'
            echo '- Production mutations: **not attempted**'
            echo '- Direct Cloudflare production credentials exposed: **no**'
            if [ -f ai-unified-executor.json ]; then
              echo
              echo '## Unified result'
              node -e "const x=require('./ai-unified-executor.json'); console.log(x.response || '')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
