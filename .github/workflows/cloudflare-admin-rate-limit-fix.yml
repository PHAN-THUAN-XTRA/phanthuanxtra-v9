name: Cloudflare Admin Rate Limit Fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ZONE_ID: 7b2653821ef0d8052bfc91c4cf5008ca
      CF_WAF_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
      RULESET_ID: aa7277416a58428cbc29f8b8c620b4d0
      RULE_ID: c2a41d2540e94ed6a6dc9855da174c3b
    steps:
      - name: Scope login protection to sensitive POST endpoints
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CF_WAF_TOKEN" ] || { echo "::error::CLOUDFLARE_WAF_API_TOKEN missing"; exit 1; }
          url="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/rulesets/$RULESET_ID/rules/$RULE_ID"
          # Cloudflare Rulesets API does not expose GET on the individual-rule endpoint.
          # Re-read the phase entrypoint and prove the audited rule still exists before PATCH.
          entrypoint="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/rulesets/phases/http_ratelimit/entrypoint"
          curl -sS --fail-with-body --max-time 30 "$entrypoint" -H "Authorization: Bearer $CF_WAF_TOKEN" > /tmp/before.json
          jq -e --arg id "$RULE_ID" '.success == true and any(.result.rules[]?; .id == $id)' /tmp/before.json >/dev/null || {
            echo "::error::Audited rate-limit rule no longer exists; refusing mutation."
            exit 1
          }
          expression='http.request.method eq "POST" and (http.request.uri.path eq "/api/admin/login" or http.request.uri.path eq "/api/admin/forgot-password" or http.request.uri.path eq "/api/admin/recovery/rotate" or http.request.uri.path eq "/login" or http.request.uri.path eq "/wp-login.php")'
          payload="$(jq -nc --arg expression "$expression" '{action:"block",description:"Login protection",enabled:true,expression:$expression,ratelimit:{characteristics:["ip.src","cf.colo.id"],mitigation_timeout:10,period:10,requests_per_period:5}}')"
          status="$(curl -sS --max-time 30 -o /tmp/update.json -w '%{http_code}' -X PATCH "$url" -H "Authorization: Bearer $CF_WAF_TOKEN" -H 'content-type: application/json' --data "$payload")"
          if [ "$status" != 200 ] || ! jq -e '.success == true' /tmp/update.json >/dev/null; then
            echo "::error::Cloudflare rule update failed HTTP $status"
            jq -c '{success,errors}' /tmp/update.json || true
            exit 1
          fi
          curl -sS --fail-with-body --max-time 30 "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/rulesets/phases/http_ratelimit/entrypoint" -H "Authorization: Bearer $CF_WAF_TOKEN" > /tmp/verify.json
          jq -e --arg id "$RULE_ID" --arg expression "$expression" '.success == true and any(.result.rules[]?; .id == $id and .enabled == true and .expression == $expression)' /tmp/verify.json >/dev/null
          echo "Cloudflare rate-limit rule scoped successfully; admin page GET routes are no longer matched."
