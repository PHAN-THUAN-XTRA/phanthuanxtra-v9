name: Android APK MVP
on:
  push:
    branches:
      - main
      - feature/apk-mvp
      - refactor/apk-architecture-v1
      - 'queue/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Production App API smoke test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 20 https://phanthuanxtra.com/api/app/v1/health)"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .service == "app-api"' >/dev/null
          echo "Production App API health: PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AI contract regression tests
        working-directory: .
        shell: bash
        run: node --test tests/ai-chat-contract.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Gradle toolchain
        run: gradle --version
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify APK output and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-apk-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish direct APK release asset
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(gate11): publish APK as direct release asset')))
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: apk-gate11-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/app-debug.apk.sha256 \
            --title "Gate 11 APK #${{ github.run_number }}" \
            --notes "Gate 11 APK direct-download release. Source: $GITHUB_SHA. Build run: $GITHUB_RUN_ID. Physical S21 Ultra regression remains required before Gate 11 can be GREEN."
          echo "Direct APK URL: https://github.com/PHAN-THUAN-XTRA/phanthuanxtra-v9/releases/download/$RELEASE_TAG/app-debug.apk"
          echo "SHA-256 URL: https://github.com/PHAN-THUAN-XTRA/phanthuanxtra-v9/releases/download/$RELEASE_TAG/app-debug.apk.sha256"
