name: Gate 10 Runtime Evidence

on:
  workflow_run:
    workflows: ["Deploy Developer Gateway"]
    types: [completed]

permissions:
  contents: read

jobs:
  gate10:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify zero-cost-first runtime
        shell: bash
        env:
          GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GATEWAY_READ_TOKEN:-}" || { echo 'Gateway read token missing'; exit 1; }
          response="$(curl -fsS --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $GATEWAY_READ_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"task_id":"gate10-runtime-evidence","mode":"audit","instruction":"Return a concise runtime verification and confirm production mutation is disabled."}' \
            https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev/v1/ai/unified)"
          python - "$response" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          assert body.get('ok') is True, body
          assert body.get('routing_policy') == 'zero-cost-first', body
          assert body.get('selected_provider') == 'gemini', body
          assert body.get('fallback_used') is False, body
          assert body.get('production_mutation') is False, body
          assert body.get('response'), body
          print(json.dumps({
              'ok': True,
              'routing_policy': body['routing_policy'],
              'selected_provider': body['selected_provider'],
              'fallback_used': body['fallback_used'],
              'model': body.get('model'),
              'production_mutation': False
          }, separators=(',', ':')))
          PY
