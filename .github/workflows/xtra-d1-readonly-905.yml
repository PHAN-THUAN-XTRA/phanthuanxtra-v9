name: XTRA D1 SELECT-only inventory audit PR905

# One-time, PR-scoped Cloudflare REST read. No Wrangler, deployment, D1 mutation or third-party action.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/xtra-d1-readonly-905.yml"

permissions:
  contents: read

jobs:
  d1-readonly:
    name: D1 production inventory read (no writes)
    if: ${{ github.event.pull_request.number == 905 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'xtra/admin-telegram-d1-sync-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fixed SELECT queries using existing GitHub Cloudflare credentials
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const account = process.env.CF_ACCOUNT_ID || '5f35d608938abe622b694bab3af1319c'; // account identifier from owner's connected Cloudflare Dashboard URL, not a secret
          const dbId = '8b6c0fc8-c278-4797-9cfa-3ec93d0c1b7d';
          const tokens = [...new Set([process.env.CF_D1_READ_TOKEN, process.env.CF_PRIMARY_TOKEN, process.env.CF_BACKUP_TOKEN].filter(Boolean))];
          const prefix = 'https://api.cloudflare.com/client/v4/accounts/';
          const endpoint = prefix + account + '/d1/database/' + dbId + '/query';
          function fail(message) { console.error('D1_READ_QA_HOLD: ' + message); process.exit(1); }
          if (!/^[0-9a-fA-F]{32}$/.test(account)) fail('Cloudflare Account ID not available or invalid');
          if (!tokens.length) fail('No scoped Cloudflare token available in GitHub Actions; no query attempted');
          const queries = [
            { key: 'count', sql: 'SELECT COUNT(*) AS total FROM cars' },
            { key: 'statuses', sql: 'SELECT status,COUNT(*) AS total FROM cars GROUP BY status' },
            { key: 'tg811', sql: "SELECT id,brand,model,category,status,price FROM cars WHERE id='tg-811' LIMIT 1" },
          ];
          const summary = { result:'READ_ONLY', source:'Cloudflare D1 API', id:'tg-811', total:null, statuses:null, tg811:null, listed:null, distinct:null, adminUnauthorized:null };
          async function query(sql, token, params=[]) {
            if (!/^SELECT\s/i.test(sql) || /;/.test(sql)) fail('Refused unexpected SQL');
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            try {
              const res = await fetch(endpoint, {
                method:'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type':'application/json' },
                body: JSON.stringify({ sql, params }),
                redirect:'error',
                signal:controller.signal
              });
              if (!res.ok) return { httpStatus:res.status };
              const d = await res.json();
              if (d.success !== true || !Array.isArray(d.result) || d.result.length !== 1 || d.result[0].success !== true) {
                return {error:'INVALID_D1_API_RESPONSE'};
              }
              const part = d.result[0];
              if ((part.meta?.changes ?? 0) !== 0 || (part.meta?.rows_written ?? 0) !== 0) fail('D1 nonzero changes detected');
              if (!Array.isArray(part.results)) return {error:'INVALID_RESULTS'};
              return { rows:part.results };
            } catch (e) {
              return { error: e?.name === 'AbortError' ? 'TIMEOUT' : 'REQUEST_ERROR' };
            } finally {clearTimeout(timeout);}
          }
          let selected = null, counter = null, lastStatus = '';
          for (const token of tokens) {
            const response = await query(queries[0].sql, token);
            if (response.rows) { selected = token; counter = response; break; }
            lastStatus = response.httpStatus ? 'HTTP_' + response.httpStatus : response.error || 'UNKNOWN';
            if (!['HTTP_401','HTTP_403'].includes(lastStatus)) break;
          }
          if (!selected) fail('D1 API read not authorized or unavailable: ' + lastStatus);
          const first = counter.rows[0];
          if (counter.rows.length !== 1 || !Number.isSafeInteger(Number(first?.total)) || Number(first.total)<0) fail('Unexpected D1 COUNT shape');
          summary.total=Number(first.total);
          if (summary.total > 10000) fail('Inventory over 10,000 rows; bounded audit refuses exhaustive enumeration');
          for (const item of queries.slice(1)) {
            const res = await query(item.sql,selected);
            if (!res.rows) fail(item.key + ' query error: ' + (res.httpStatus || res.error));
            if (item.key === 'statuses') {
              summary.statuses = Object.fromEntries(res.rows.map(x=>[String(x.status),Number(x.total)]));
              const sum=Object.values(summary.statuses).reduce((a,b)=>a+b,0);
              if(sum!==summary.total)fail('Status counts do not match D1 total');
            }
            if (item.key === 'tg811') {
              summary.tg811 = res.rows.length ? res.rows[0] : null;
              if(res.rows.length>1)fail('Duplicate tg811 lookup result');
            }
          }
          const seen = new Set();
          for (let offset=0;offset<summary.total;offset+=100) {
            const res=await query('SELECT id FROM cars ORDER BY id LIMIT ? OFFSET ?',selected,[100,offset]);
            if(!res.rows)fail('Paginated inventory read failed at offset '+offset+': '+(res.httpStatus||res.error));
            if (!res.rows.length) fail('Incomplete D1 inventory at offset '+offset);
            for(const item of res.rows) {
              if(typeof item.id!=='string'||!item.id||seen.has(item.id)) fail('Duplicate/invalid car id in D1');
              seen.add(item.id);
            }
          }
          summary.listed=seen.size;
          summary.distinct=seen.size;
          summary.tg811InInventory=seen.has('tg-811');
          if(summary.listed!==summary.total)fail('D1 count differs from exhaustive page scan');
          try {
            const res=await fetch('https://phanthuanxtra.com/api/admin/cars?limit=1', {redirect:'manual',signal:AbortSignal.timeout(10000)});
            summary.adminUnauthorized=res.status;
          } catch {summary.adminUnauthorized='REQUEST_UNAVAILABLE';}
          console.log('D1_READ_RECEIPT '+JSON.stringify(summary));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### XTRA D1 read-only evidence\n\n```json\n'+JSON.stringify(summary,null,2)+'\n```\n');
          if(summary.adminUnauthorized!==401)fail('Real Admin API unauthenticated request did not return HTTP 401');
          if(!summary.tg811)fail('tg-811 missing from D1: source reconciliation requires independent review; no write performed');
          NODE
