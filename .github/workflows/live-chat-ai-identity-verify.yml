name: Live Chat AI Identity Verify

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record deployed production revision
        run: echo "AI E2E after deploy run ${{ github.event.workflow_run.id }} for SHA ${{ github.event.workflow_run.head_sha }}"
      - name: Verify no-accent Phan Thuan identity response
        shell: bash
        env:
          SITE_URL: https://phanthuanxtra.com
        run: |
          set -euo pipefail
          CID="ci-ai-chat-${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg cid "$CID" '{conversation_id:$cid,visitor_id:$cid,message:"phan thuan la ai",suppress_crm_notification:true,test_context:"production-smoke"}')"
          status="$(curl --silent --show-error --max-time 90 -o /tmp/identity.json -w '%{http_code}' -X POST "$SITE_URL/api/ai-chat" -H 'content-type: application/json' --data "$payload")"
          echo "Identity HTTP $status"
          cat /tmp/identity.json
          test "$status" = "200"
          jq -e '.ok == true and .needs_human == false and (.reply | contains("Phan Thuần")) and (.reply | contains("PHAN THUẦN XTRA"))' /tmp/identity.json >/dev/null
          if jq -e '.reply | contains("Tôi chưa có thông tin xác thực")' /tmp/identity.json >/dev/null; then
            echo "Identity regression still present."
            exit 1
          fi
          echo "No-accent identity response: PASS"

      - name: Verify full-site AI advisory on production
        shell: bash
        env:
          SITE_URL: https://phanthuanxtra.com
        run: |
          set -euo pipefail
          verify_topic() {
            label="$1"
            message="$2"
            required="$3"
            seq="$4"
            cid="ci-ai-chat-${GITHUB_RUN_ID}${seq}"
            payload="$(jq -nc --arg cid "$cid" --arg message "$message" '{conversation_id:$cid,visitor_id:$cid,message:$message,suppress_crm_notification:true,test_context:"production-smoke"}')"
            status="$(curl --silent --show-error --max-time 90 -o "/tmp/${label}.json" -w '%{http_code}' -X POST "$SITE_URL/api/ai-chat" -H 'content-type: application/json' --data "$payload")"
            echo "$label HTTP $status"
            cat "/tmp/${label}.json"
            test "$status" = "200"
            jq -e '.ok == true and .needs_human == false' "/tmp/${label}.json" >/dev/null
            jq -er '.reply' "/tmp/${label}.json" | grep -Eiq "$required"
          }
          verify_topic green-energy "Tư vấn điện mặt trời PV và ESS trên website" "Green Energy|ESS|điện mặt trời|năng lượng" 1
          verify_topic yachts "Tôi muốn tư vấn du thuyền theo nội dung website" "du thuyền|yacht|Jeanneau|Prestige|Ferretti|Riva" 2
          verify_topic business-jets "Tôi muốn tư vấn chuyên cơ thương gia theo nội dung website" "chuyên cơ|Business Jet|Legacy 600|hàng không" 3
          verify_topic contact "Hotline liên hệ chính thức là gì?" "0866 997 891|0866997891" 4
          echo "Full-site production AI advisory: PASS"

      - name: Verify public vehicle catalog excludes CI records
        shell: bash
        env:
          SITE_URL: https://phanthuanxtra.com
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 90 "$SITE_URL/api/cars" > /tmp/cars.json
          jq -e '.cars | type == "array"' /tmp/cars.json >/dev/null
          jq -e '[.cars[]? | select(
            (.id | tostring | test("^(ci-e2e-|ci-origin-e2e-|stage3-|gate15-)"))
            or (.brand == "PT XTRA TEST")
            or (.brand == "PT XTRA STAGE3")
            or (.brand == "PT XTRA GATE15")
          )] | length == 0' /tmp/cars.json >/dev/null
          echo "Public cars: $(jq '.cars | length' /tmp/cars.json)"
          jq -r '.cars[]? | "- \(.brand // "") \(.name // .model // "") [\(.tag // .status // "")]"' /tmp/cars.json | head -20
          echo "Public vehicle catalog: PASS"
