name: Cloudflare Token + Workers AI Auth Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gate15-single-queue

permissions:
  contents: read

concurrency:
  group: xtra-cloudflare-auth-smoke
  cancel-in-progress: false

jobs:
  cloudflare-auth:
    name: Verify Cloudflare API Token + Workers AI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "Cloudflare API token: present"
          echo "Cloudflare account ID: present"

      - name: Verify Cloudflare token authentication
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$response" > /tmp/cloudflare-account.json
          jq -e '.success == true' /tmp/cloudflare-account.json >/dev/null
          echo "Cloudflare API authentication: PASS"

      - name: Diagnose Workers AI response schema
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error --retry 2 --max-time 90 \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"prompt":"Return exactly: XTRA_CLOUDFLARE_AI_AUTH_OK"}'
          )"

          printf '%s' "$response" > /tmp/workers-ai.json

          echo "Workers AI API returned valid HTTP response."

          jq -e '.success == true' /tmp/workers-ai.json >/dev/null
          echo "Workers AI API success: PASS"

          echo "Top-level JSON keys:"
          jq -c 'keys' /tmp/workers-ai.json

          echo "Result JSON type:"
          jq -r '.result | type' /tmp/workers-ai.json

          echo "Result JSON keys:"
          jq -c '(.result // {}) | if type == "object" then keys else [] end' /tmp/workers-ai.json

          echo "Response field type:"
          jq -r '.result.response | type' /tmp/workers-ai.json

          echo "Response field:"
          jq -c '.result.response' /tmp/workers-ai.json

          echo "Errors:"
          jq -c '.errors' /tmp/workers-ai.json

          echo "Messages:"
          jq -c '.messages' /tmp/workers-ai.json

          echo "Workers AI response diagnostic: COMPLETE"

      - name: Safety assertion
        shell: bash
        run: |
          set -euo pipefail
          echo "No Wrangler deploy executed."
          echo "No D1 migration executed."
          echo "No R2 mutation executed."
          echo "No Worker deployment executed."
          echo "Production mutation: FALSE"
