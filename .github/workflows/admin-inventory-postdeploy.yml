name: Admin Inventory Read-only Postdeploy

# Authenticated read-only smoke after successful main production deployment.
# No Wrangler, no D1 migrations, no mutations, no tokens or private car lists in logs.
on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify complete authenticated Admin inventory
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare all signed Admin pages to dashboard and public visibility
        shell: bash
        env:
          QA_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const origin = 'https://phanthuanxtra.com';
          const fail = why => { console.error('ADMIN_INVENTORY_VERIFY_FAILED: ' + why); process.exit(1); };
          if (!process.env.QA_ADMIN_PASSWORD) fail('Admin credential unavailable; no authenticated request sent');
          async function read(path, token, method='GET', payload) {
            const response = await fetch(origin+path,{
              method,
              cache:'no-store',
              redirect:'manual',
              signal:AbortSignal.timeout(15000),
              headers: {
                Accept:'application/json',
                ...(token?{Authorization:'Bearer '+token}:{}),
                ...(payload?{'Content-Type':'application/json'}:{})
              },
              ...(payload?{body:JSON.stringify(payload)}:{})
            });
            if(response.status>=300&&response.status<400)fail('Unexpected redirect for '+path);
            return {status:response.status, data:await response.json().catch(()=>null)};
          }
          const anonymous=await read('/api/admin/cars?limit=1');
          if(anonymous.status!==401)fail('Unauthenticated Admin must respond HTTP 401');
          const login=await read('/api/admin/login',null,'POST',{password:process.env.QA_ADMIN_PASSWORD});
          if(login.status!==200||typeof login.data?.token!=='string')fail('Owner Admin login preflight failed');
          const token=login.data.token;
          const dashboard=await read('/api/admin/dashboard',token);
          if(dashboard.status!==200)fail('Admin dashboard unavailable');
          const total=Number(dashboard.data?.stats?.cars);
          if(!Number.isSafeInteger(total)||total<1||total>10000)fail('Invalid or oversized dashboard count');
          const seen=new Set(), statuses={};
          let listedTg811=null;
          let count=0;
          for(let offset=0;offset<total;offset+=50){
            const page=await read('/api/admin/cars?limit=50&offset='+offset,token);
            const data=page.data;
            if(page.status!==200||!Array.isArray(data?.cars)||data.total!==total||data.offset!==offset)fail('Page metadata mismatched at offset '+offset);
            if(data.cars.length<1||data.cars.length>50)fail('Empty or oversized page at offset '+offset);
            for(const car of data.cars){
              if(typeof car.id!=='string'||!car.id||seen.has(car.id))fail('Duplicate/invalid car ID');
              seen.add(car.id);
              if(car.id==='tg-811')listedTg811=car;
              const status=String(car.status||'unknown');
              statuses[status]=(statuses[status]||0)+1;
              count++;
            }
          }
          if(count!==total||seen.size!==total)fail('Incomplete signed Admin listing');
          const phantom=await read('/api/admin/cars/tg-811',token);
          if(phantom.status!==200||phantom.data?.car?.id!=='tg-811')fail('tg-811 unavailable to authenticated Admin');
          const car=phantom.data.car;
          if(!seen.has('tg-811'))fail('tg-811 missing from Admin pagination');
          if(!listedTg811||String(listedTg811.category)!==String(car.category)||Number(listedTg811.price)!==Number(car.price))fail('tg-811 detail and listing metadata mismatch');
          const publicCars=await read('/api/cars');
          if(publicCars.status!==200||!Array.isArray(publicCars.data?.cars))fail('Public catalogue unavailable');
          if(publicCars.data.cars.some(x=>x.status==='hidden'))fail('Hidden vehicle leaked in public catalogue');
          if(car.status==='available'){
            const publicTg811=publicCars.data.cars.find(x=>x.id==='tg-811');
            if(!publicTg811||Number(publicTg811.price)!==Number(car.price)||String(publicTg811.category)!==String(car.category))fail('Available tg-811 does not match public vehicle catalogue');
          }
          const htmlPaths=['/admin-control','/admin-control.html'];
          for(const path of htmlPaths){
            const res=await fetch(origin+path+'?inventory_verify='+encodeURIComponent(process.env.GITHUB_RUN_ID||'qa'),{
              redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(12000)
            });
            if(res.status!==200)fail('Admin HTML unavailable for '+path);
            const html=await res.text();
            if(!html.includes('all.length!==expected')||!html.includes('id="carSync"')||!html.includes('<option value="hidden">hidden</option>'))fail('Outdated Admin HTML for '+path);
          }
          const receipt={
            anonymousHttp:anonymous.status,
            signedAdmin:true,
            dashboardTotal:total,
            adminListTotal:count,
            uniqueCars:seen.size,
            available:statuses.available||0,
            hidden:statuses.hidden||0,
            tg811:{present:true,category:car.category,price:Number(car.price),status:car.status},
            publicHidden:0,
            htmlVariantsVerified:htmlPaths.length,
            method:'GET/SELECT-only'
          };
          console.log('ADMIN_INVENTORY_POSTDEPLOY '+JSON.stringify(receipt));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Admin Inventory Postdeploy — READ ONLY\n\n```json\n'+JSON.stringify(receipt,null,2)+'\n```\n');
          NODE
