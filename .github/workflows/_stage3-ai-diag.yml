name: Stage 3 AI Diagnostic

on:
  push:
    branches:
      - diag/stage3-workers-ai-response

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe Workers AI response shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for model in '@cf/zai-org/glm-4.7-flash' '@cf/meta/llama-3.2-3b-instruct'; do
            echo "=== MODEL ${model} ==="
            response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 90 -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/${model}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"Return exactly STAGE3_AI_OK"}],"temperature":0,"max_tokens":500}')"
            printf '%s\n' "$response" | jq -c '{success, result_type:(.result|type), result_keys:(if (.result|type)=="object" then (.result|keys) else [] end), response:(.result.response // null), content:(.result.choices[0].message.content // null)}'
          done