name: Deploy Cloudflare Worker

# Production deployment is GitHub Actions -> Cloudflare API/SDK.
# Wrangler must not be used as a production deployment mechanism.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "AUDIT_*.md"
      - "backup/README.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  CLOUDFLARE_SDK_VERSION: 7.1.0
  CLOUDFLARE_ZONE_ID: 7b2653821ef0d8052bfc91c4cf5008ca

jobs:
  validate:
    name: CI / Validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate deployment controller syntax
        run: |
          node --check scripts/deploy-cloudflare-api.mjs
          node --check scripts/cloudflare-assets-upload.mjs
          node --check tests/cloudflare-assets-upload.test.mjs
      - name: Simulate Cloudflare Assets protocol
        run: node --test tests/cloudflare-assets-upload.test.mjs
      - name: Validate JavaScript syntax and tests
        run: |
          set -euo pipefail
          node --check src/entry.js
          node --check src/cms.js
          node --check src/index.js
          node --check src/app-api.js
          node --check src/app-admin.js
          node --check src/telegram.js
          node --check src/telegram-ingest.js
          node --check src/telegram-router.js
          node --check src/vip-telegram.js
          node --check src/vip-vehicle-intelligence.js
          node --check src/vehicle-ai.js
          node --check src/media.js
          node --check src/ai-chat.js
          node --check src/plate-branding.js
          node --check public/script.js
          node --test tests/admin-auth.test.mjs tests/admin-password.test.mjs tests/app-admin-contract.test.mjs tests/telegram.test.mjs tests/ai-chat.test.mjs tests/pt-xtra-media.test.mjs tests/pt-xtra-plate.test.mjs tests/plate-branding.test.mjs tests/production-gates.test.mjs tests/vip-vehicle-intelligence.test.mjs

  deploy:
    name: Deploy production Worker (Cloudflare API/SDK)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Cloudflare TypeScript SDK transport
        run: npm install --no-save --ignore-scripts cloudflare@${{ env.CLOUDFLARE_SDK_VERSION }}
      - name: Resolve Cloudflare API credentials
        shell: bash
        env:
          CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${CF_ACCOUNT_ID:-}" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID is absent or invalid; refusing API deployment."
            exit 1
          fi
          selected=""
          for candidate in "${CF_PRIMARY_TOKEN:-}" "${CF_BACKUP_TOKEN:-}"; do
            if [ -z "$candidate" ]; then continue; fi
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${candidate}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/phanthuanxtra-v2" \
              >/dev/null; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "No configured Cloudflare API token authenticated successfully."
            exit 1
          fi
          {
            echo "CLOUDFLARE_API_TOKEN<<EOF"
            printf '%s\n' "$selected"
            echo "EOF"
            echo "CLOUDFLARE_ACCOUNT_ID=${CF_ACCOUNT_ID}"
            echo "CLOUDFLARE_ASSET_TRANSPORT=sdk"
          } >> "$GITHUB_ENV"
          echo "Cloudflare API credential source authenticated without exposing token values."
      - name: Deploy and migrate through Cloudflare API/SDK
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_RECOVERY_ROTATE_TOKEN: ${{ secrets.ADMIN_RECOVERY_ROTATE_TOKEN }}
        run: node scripts/deploy-cloudflare-api.mjs
      - name: Verify public production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://phanthuanxtra.com/)" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://phanthuanxtra.com/api/health)" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://phanthuanxtra.com/admin.html)" = "200"
          echo "Public smoke: /, /api/health, /admin.html => HTTP 200."
      - name: Verify Admin UTF-8 asset delivery
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30 -D /tmp/admin.headers -o /tmp/admin.html https://phanthuanxtra.com/admin.html
          grep -Eiq '^content-type:[[:space:]]*text/html;[[:space:]]*charset=utf-8([[:space:]]*;|[[:space:]]*$)' /tmp/admin.headers
          if grep -Eiq '^content-encoding:' /tmp/admin.headers; then exit 1; fi
          grep -Fq 'PHAN THUẦN XTRA' /tmp/admin.html
          ! grep -Fq 'PHAN THUáº¦N XTRA' /tmp/admin.html
          ! grep -Fq 'ÄÄƒng nháº­p Admin' /tmp/admin.html
          echo "Admin asset delivery: HTTP 200; UTF-8 content-type; no content-encoding; mojibake markers absent."
      - name: Purge changed Admin HTML cache
        shell: bash
        env:
          CF_PURGE_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ env.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          payload='{"files":["https://phanthuanxtra.com/admin.html"]}'
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache")"
          echo "$response" | jq -e '.success == true' >/dev/null
          echo "Cloudflare targeted purge: /admin.html => API success."
          curl --silent --show-error --fail --max-time 30 -D /tmp/admin-purge.headers -o /tmp/admin-purge.html "https://phanthuanxtra.com/admin.html?purge_verify=${GITHUB_SHA}"
          grep -Fq 'PHAN THUẦN XTRA' /tmp/admin-purge.html
          echo "Post-purge Admin asset verification: PASS."

      - name: R2 Worker E2E GET DELETE 404
        shell: bash
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          base="https://phanthuanxtra.com"
          login_payload="$(node -e 'process.stdout.write(JSON.stringify({password:process.env.ADMIN_PASSWORD}))')"
          login="$(curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data "$login_payload" \
            "${base}/api/admin/login")"
          token="$(printf '%s' "$login" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok||!j.token)process.exit(1);process.stdout.write(j.token)})')"
          test -n "$token"
          upload="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            -H 'content-type: image/png' \
            --data-binary 'PT-XTRA-R2-E2E' \
            "${base}/api/admin/media")"
          key="$(printf '%s' "$upload" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok||!j.key)process.exit(1);process.stdout.write(j.key)})')"
          encoded_key="$(printf '%s' "$key" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(encodeURIComponent(s.trim())))')"
          media_url="${base}/media/${encoded_key}"
          cf_status() {
            local method="$1" url="$2" attempt=1 status retry_after
            shift 2
            while [ "$attempt" -le 4 ]; do
              status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -X "$method" "$@" "$url")" || true
              echo "R2 ${method} attempt ${attempt} HTTP ${status}"
              if [ "$status" != "429" ]; then CF_LAST_STATUS="$status"; return 0; fi
              retry_after=10
              echo "Cloudflare rate limit (1015/429); waiting ${retry_after}s before retry"
              sleep "$retry_after"
              attempt=$((attempt + 1))
            done
            CF_LAST_STATUS="429"; return 1
          }
          cf_status GET "$media_url" -H 'cache-control: no-cache'
          test "$CF_LAST_STATUS" = "200"
          cf_status DELETE "$media_url" -H "Authorization: Bearer ${token}"
          test "$CF_LAST_STATUS" = "200"
          post_delete_url="${media_url}?r2_e2e_cache_bust=$(date +%s%N)"
          cf_status GET "$post_delete_url" -H 'cache-control: no-cache'
          test "$CF_LAST_STATUS" = "404"
          echo "R2 Worker E2E: upload -> GET 200 -> DELETE 200 -> cache-busted GET 404."
      - name: Deployment completed
        run: |
          echo "========================================"
          echo "Cloudflare API/SDK deployment completed"
          echo "Wrangler production deployment path: NOT USED"
          echo "R2 Worker E2E GET/DELETE/404 completed"
          echo "========================================"
