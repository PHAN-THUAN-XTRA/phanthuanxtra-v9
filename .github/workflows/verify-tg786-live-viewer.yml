name: Verify HUMMER 786 Live Image Viewer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tg786-live-viewer.yml"
      - "scripts/verify-tg786-live-viewer.mjs"
      - "public/image-viewer.js"
      - "public/car.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-hummer-lightbox-audit
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser for public read-only acceptance
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Check photo viewer on actual production car page (desktop/mobile)
        run: node scripts/verify-tg786-live-viewer.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tg786-visitor-viewer-diagnostic
          path: artifacts/
          if-no-files-found: ignore
