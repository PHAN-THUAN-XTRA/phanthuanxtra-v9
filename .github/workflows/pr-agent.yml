# Review-only PR-Agent setup. No checkout, code execution, deployment, or auto-merge.
# To enable, set the GEMINI_API_KEY Actions secret after assessing code-sharing policy.
# Fork PRs and drafts are intentionally not sent to the external model.
name: PR Agent - AI review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai_review:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Review PR with pinned PR-Agent v0.49.0
        if: ${{ env.HAS_GEMINI_KEY == 'true' }}
        uses: docker://pragent/pr-agent:0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '[]'
          github_action_config.pr_actions: '["opened","reopened","synchronize","ready_for_review"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          pr_reviewer.extra_instructions: >-
            PUBLIC automotive website. Look for exposed credentials or customer data, regressions in vehicle listing IDs, availability, prices, image order, and Admin/Telegram parity. Flag any Cloudflare production deployment or live inventory mutation. Never claim production QA from a source-only PR.

      - name: Report inactive integration when credential is absent
        if: ${{ env.HAS_GEMINI_KEY != 'true' }}
        run: echo "PR-Agent is configured but inactive. Add GEMINI_API_KEY in GitHub Actions secrets."
