plugins { id 'com.android.application' }

android { namespace 'com.phanthuanxtra.app'; compileSdk 35
    defaultConfig { applicationId 'com.phanthuanxtra.app'; minSdk 26; targetSdk 35; versionCode 7; versionName '1.6.0' }
    signingConfigs {
        release {
            def keyFile = System.getenv('ANDROID_RELEASE_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
        }
    }
}
