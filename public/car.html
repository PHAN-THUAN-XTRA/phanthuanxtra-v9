<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><meta name="theme-color" content="#111111"><title>Chi tiết xe | PHAN THUẦN XTRA</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><style>.vehicle-description{white-space:pre-line;line-height:1.75;margin:24px 0}.vehicle-gallery{margin-top:24px}.vehicle-gallery h2{margin-bottom:14px}.vehicle-gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.vehicle-gallery-grid a{display:block;overflow:hidden;border-radius:12px;background:#f3f3f3;aspect-ratio:4/3}.vehicle-gallery-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease}.vehicle-gallery-grid a:hover img{transform:scale(1.02)}@media(max-width:760px){.vehicle-gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vehicle-description{line-height:1.65}}</style></head><body><a class="skip-link" href="#main">Bỏ qua đến nội dung</a><header class="header"><div class="container nav"><a class="logo" href="/">PHAN THUẦN <span>XTRA</span></a><nav id="site-nav"><a href="/#cars-section">Xe đang bán</a><a href="/#services">Dịch vụ</a><a href="/#contact">Liên hệ</a></nav><a class="hotline" href="tel:+84866997891">0866 997 891</a></div></header><main id="main" class="detail"><div class="container"><a class="back" href="/#cars-section">← Quay lại danh sách xe</a><div id="vehicleDetail"><p class="notice">Đang tải thông tin xe...</p></div></div></main><footer><div class="container footer"><b>PHAN THUẦN XTRA</b><span>© 2026 PHAN THUẦN XTRA</span></div></footer><script>
const id=new URLSearchParams(location.search).get('id')||'',root=document.getElementById('vehicleDetail');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n};
fetch('/api/cars',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('Không tải được kho xe'))).then(d=>{
 const c=(d.cars||[]).find(x=>String(x.id)===id);if(!c)throw Error('Không tìm thấy xe hoặc xe không còn hiển thị.');
 document.title=(c.brand+' '+(c.name||c.model||''))+' | PHAN THUẦN XTRA';
 const imgs=Array.isArray(c.images)?c.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):[],cover=c.cover_image||imgs[0]||'',gallery=imgs.filter(x=>x!==cover),features=Array.isArray(c.features)?c.features:[];
 root.replaceChildren();const grid=el('div','detail-grid'),visual=el('div'),info=el('div','detail-info');
 if(cover){const img=el('img');img.src=cover;img.alt=(c.brand||'')+' '+(c.name||'');img.style.cssText='width:100%;height:auto;border-radius:12px';visual.append(img)}else visual.append(el('div','detail-image '+(c.imageClass||'')));
 info.append(el('p','eyebrow',c.brand||'PHAN THUẦN XTRA'),el('h1','',(c.brand||'')+' '+(c.name||c.model||'')),el('p','lead',[c.year,c.engine,c.odo].filter(Boolean).join(' • ')),el('div','price big',c.price||'Liên hệ'));
 if(c.description)info.append(el('div','vehicle-description',c.description));
 if(features.length){info.append(el('h2','', 'Trang bị nổi bật'));const ul=el('ul','options');features.forEach(x=>ul.append(el('li','',x)));info.append(ul)}
 const actions=el('div','actions'),call=el('a','btn primary','Gọi tư vấn'),zalo=el('a','btn zalo','Nhắn Zalo');call.href='tel:+84866997891';zalo.href='https://zalo.me/0866997891';zalo.rel='noopener noreferrer';actions.append(call,zalo);info.append(actions);grid.append(visual,info);root.append(grid);
 if(gallery.length){const section=el('section','vehicle-gallery'),g=el('div','vehicle-gallery-grid');section.append(el('h2','',`Hình ảnh chi tiết (${imgs.length} ảnh)`));gallery.forEach((src,i)=>{const a=el('a'),img=el('img');a.href=src;a.target='_blank';a.rel='noopener noreferrer';img.loading='lazy';img.decoding='async';img.src=src;img.alt=(c.brand||'')+' '+(c.name||c.model||'')+' — ảnh '+(i+2);a.append(img);g.append(a)});section.append(g);root.append(section)}
}).catch(e=>{root.replaceChildren();const box=el('div','notice');box.append(el('h1','', 'Không thể hiển thị xe'),el('p','',e.message));const a=el('a','btn primary','Về kho xe');a.href='/#cars-section';box.append(a);root.append(box)});
</script></body></html>
