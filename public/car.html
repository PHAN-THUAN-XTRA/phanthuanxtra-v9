const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id')||'';const root=document.getElementById('vehicleDetail');
fetch('/api/cars',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('Không tải được kho xe'))).then(d=>{const c=(d.cars||[]).find(x=>String(x.id)===id);if(!c)throw Error('Không tìm thấy xe hoặc xe không còn hiển thị.');document.title=(c.brand+' '+(c.name||c.model||''))+' | PHAN THUẦN XTRA';const imgs=Array.isArray(c.images)?c.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):[];const cover=c.cover_image||imgs[0]||'';const features=Array.isArray(c.features)?c.features:[];root.innerHTML='<div class="detail-grid"><div>'+(cover?'<img src="'+esc(cover)+'" alt="'+esc(c.brand+' '+(c.name||''))+'" style="width:100%;height:auto;border-radius:12px">':'<div class="detail-image '+esc(c.imageClass||'')+'"></div>')+'</div><div class="detail-info"><p class="eyebrow">'+esc(c.brand||'PHAN THUẦN XTRA')+'</p><h1>'+esc((c.brand||'')+' '+(c.name||c.model||''))+'</h1><p class="lead">'+esc([c.year,c.engine,c.odo].filter(Boolean).join(' • '))+'</p><div class="price big">'+esc(c.price||'Liên hệ')+'</div>'+(c.description?'<p>'+esc(c.description)+'</p>':'')+(features.length?'<h2>Trang bị nổi bật</h2><ul class="options">'+features.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<div class="actions"><a class="btn primary" href="tel:+84866997891">Gọi tư vấn</a><a class="btn zalo" href="https://zalo.me/0866997891" rel="noopener noreferrer">Nhắn Zalo</a></div></div></div>'}).catch(e=>{root.innerHTML='<div class="notice"><h1>Không thể hiển thị xe</h1><p>'+esc(e.message)+'</p><a class="btn primary" href="/#cars-section">Về kho xe</a></div>'});
</script></body></html>
