</style><link rel="stylesheet" href="/content-review.css?v=20261003-1"></head><body><main class="wrap"><div id="listView"><div class="head"><div class="sub">PHAN THUẦN XTRA · TELEGRAM MINI APP</div><h1 id="viewTitle">Quản lý xe</h1><div class="tabs"><button id="carsTab" class="primary">🚘 Xe</button><button id="customersTab">🤝 Khách hàng</button><button id="contentTab">📝 Nội dung</button></div><div class="tools"><input id="q" placeholder="Tìm ID, hãng, mẫu xe…"><select id="filter"><option value="">Tất cả trạng thái</option><option value="available">Đang bán</option><option value="reserved">Đã giữ</option><option value="sold">Đã bán</option><option value="hidden">Đang ẩn</option></select></div><div id="notice"></div><div id="summary" class="meta">Đang xác thực Telegram…</div></div><section id="cars"></section><section id="customers" class="hidden"></section><section id="contentReview" class="hidden"></section></div><section id="detailView" class="hidden"></section></main>
<script src="/content-review.js?v=20261003-1"></script><script>
const tg=window.Telegram?.WebApp,$=s=>document.querySelector(s),labels={available:"Đang bán",reserved:"Đã giữ",sold:"Đã bán",hidden:"Đang ẩn"},careLabels={new:"Mới",contacting:"Đang liên hệ",consulting:"Đang tư vấn",appointment:"Hẹn xem xe",follow_up:"Theo dõi",won:"Đã mua",lost:"Không phù hợp"};let cars=[],customers=[],detail=null,view=["customers","content"].includes(new URLSearchParams(location.search).get("view"))?new URLSearchParams(location.search).get("view"):"cars";if(tg){tg.ready();tg.expand()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function notice(msg,bad=false){const n=$("#notice");n.textContent=msg;n.className=bad?"err":"ok";setTimeout(()=>n.className="",2600)}
async function api(path,opt={}){const init=tg?.initData||"";if(!init)throw Error("Hãy mở Mini App từ bot Telegram.");opt.headers={...(opt.headers||{}),"X-Telegram-Init-Data":init};if(opt.body)opt.headers["content-type"]="application/json";const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Lỗi máy chủ");return d}
function money(v){return Number(v||0).toLocaleString("vi-VN")+" đ"}function odo(v){return v===null||v===undefined||v===""?"Chưa nhập":Number(v).toLocaleString("vi-VN")+" km"}
function setView(next){view=next;$("#contentTab").className=view==="content"?"primary":"";$("#contentReview").classList.toggle("hidden",view!=="content");$("#listView .tools").classList.toggle("hidden",view==="content");$("#summary").classList.toggle("hidden",view==="content");if(view==="content")contentReviewPanel.load();detail=null;$("#detailView").classList.add("hidden");$("#listView").classList.remove("hidden");$("#carsTab").className=view==="cars"?"primary":"";$("#customersTab").className=view==="customers"?"primary":"";$("#cars").classList.toggle("hidden",view!=="cars");$("#customers").classList.toggle("hidden",view!=="customers");$("#viewTitle").textContent=view==="cars"?"Quản lý xe":view==="content"?"Review nội dung":"Chăm sóc khách hàng";$("#q").placeholder=view==="cars"?"Tìm ID, hãng, mẫu xe…":"Tìm tên, SĐT, customer ID…";$("#filter").replaceChildren();const first=el("option","","Tất cả trạng thái");first.value="";$("#filter").append(first);const source=view==="cars"?labels:careLabels;for(const [v,l] of Object.entries(source)){const o=el("option","",l);o.value=v;$("#filter").append(o)}render()}
function renderCustomers(){const q=$("#q").value.trim().toLowerCase(),status=$("#filter").value,list=customers.filter(c=>(!status||c.care_status===status)&&(!q||[c.id,c.display_name,c.phone,c.car_id].join(" ").toLowerCase().includes(q)));$("#summary").textContent=`${list.length}/${customers.length} khách`;const root=$("#customers");root.replaceChildren();for(const c of list){const card=el("article","card"),avatar=el("div","thumb");avatar.textContent="👤";avatar.style.cssText="display:grid;place-items:center;font-size:32px";const body=el("div");body.append(el("div","name",c.display_name||"Khách chưa có tên"),el("div","meta",`${c.phone||"Chưa có SĐT"} · ${c.car_id||"Chưa ghi xe"} · ${c.episode_count||0} tương tác`));const p=el("span","pill",careLabels[c.care_status]||c.care_status);body.append(p);if(c.follow_up_at)body.append(el("div",new Date(c.follow_up_at)<=new Date()?"meta due":"meta",`Follow-up: ${new Date(c.follow_up_at).toLocaleString("vi-VN")}`));const a=el("div","actions"),open=el("button","primary","Hồ sơ / Chăm sóc");open.onclick=()=>openCustomer(c.id);a.append(open);body.append(a);card.append(avatar,body);root.append(card)}if(!list.length)root.append(el("p","meta","Không có khách hàng phù hợp."))}
function render(){if(view==="content")return;if(view==="customers"){renderCustomers();return}const q=$("#q").value.trim().toLowerCase(),status=$("#filter").value,list=cars.filter(c=>(!status||c.status===status)&&(!q||[c.id,c.brand,c.model,c.year].join(" ").toLowerCase().includes(q)));$("#summary").textContent=`${list.length}/${cars.length} xe`;const root=$("#cars");root.replaceChildren();for(const c of list){const card=el("article","card"),img=c.cover_image||c.images?.[0]?.url||"",thumb=img?el("img","thumb"):el("div","thumb");if(img){thumb.src=img;thumb.alt=""}const body=el("div");body.append(el("div","name",`${c.brand||""} ${c.model||""}`.trim()),el("div","meta",`${c.id} · ${c.year||""} · ${money(c.price)} · ${odo(c.mileage)}`));const a=el("div","actions"),open=el("button","primary","Chi tiết / Sửa");open.onclick=()=>openCar(c.id);a.append(open);for(const [s,l] of Object.entries(labels)){const b=el("button",c.status===s?"active":"",l);b.onclick=()=>changeStatus(c.id,s);a.append(b)}body.append(a);card.append(thumb,body);root.append(card)}if(!list.length)root.append(el("p","meta","Không có xe phù hợp."))}
async function load(){try{const [cd,ud]=await Promise.all([api("/api/telegram/mini/v1/cars"),api("/api/telegram/mini/v1/customers")]);cars=cd.cars||[];customers=ud.customers||[];render()}catch(e){$("#summary").textContent="Không thể tải";notice(e.message,true)}}
async function changeStatus(id,status){const c=cars.find(x=>x.id===id);if(!c||c.status===status)return;const go=()=>commitStatus(id,status);if(tg?.showConfirm)tg.showConfirm(`${c.brand} ${c.model}: ${labels[c.status]} → ${labels[status]}`,ok=>ok&&go());else if(confirm("Xác nhận đổi trạng thái?"))go()}
async function commitStatus(id,status){try{await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(id)}/status`,{method:"PATCH",body:JSON.stringify({status})});const c=cars.find(x=>x.id===id);if(c)c.status=status;render();if(detail?.car?.id===id)openCar(id);notice("Đã cập nhật trạng thái.")}catch(e){notice(e.message,true)}}
async function openCar(id){try{detail=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(id)}`);renderDetail()}catch(e){notice(e.message,true)}}
async function openCustomer(id){try{detail=await api(`/api/telegram/mini/v1/customers/${encodeURIComponent(id)}`);renderCustomerDetail()}catch(e){notice(e.message,true)}}
function renderCustomerDetail(){const d=$("#detailView");d.replaceChildren();$("#listView").classList.add("hidden");d.classList.remove("hidden");const c=detail.customer,back=el("button","back","← Danh sách khách");back.onclick=closeDetail;d.append(back,el("h1","",c.display_name||"Khách chưa có tên"),el("div","meta",c.id));const p=el("div","panel"),g=el("div","grid"),statusLabel=el("label","","Trạng thái chăm sóc"),sel=el("select");sel.id="careStatus";for(const [v,l] of Object.entries(careLabels)){const o=el("option","",l);o.value=v;o.selected=c.care_status===v;sel.append(o)}statusLabel.append(sel);const followLabel=el("label","","Follow-up"),follow=el("input");follow.type="datetime-local";follow.id="followUp";if(c.follow_up_at)follow.value=new Date(c.follow_up_at).toISOString().slice(0,16);followLabel.append(follow);const noteLabel=el("label","wide","Ghi chú chăm sóc"),note=el("textarea");note.id="careNote";note.value=c.note||"";noteLabel.append(note);const save=el("button","primary wide","Lưu chăm sóc");save.onclick=saveCustomerCare;const del=el("button","danger wide","Xóa khách hàng");del.onclick=deleteCustomer;g.append(statusLabel,followLabel,noteLabel,save,del);p.append(g);d.append(p);const proposals=el("div","panel");proposals.append(el("h2","","AI đề xuất chăm sóc"));for(const p of detail.proposals||[]){const row=el("div","audit"),label=careLabels[p.proposed_value]||p.proposed_value;row.append(el("div","",`${label} · ${Math.round(Number(p.confidence||0)*100)}%\n${p.rationale||""}`));const actions=el("div","actions"),yes=el("button","primary","Duyệt"),no=el("button","","Bỏ qua");yes.onclick=()=>decideProposal(p.id,"approve");no.onclick=()=>decideProposal(p.id,"reject");actions.append(yes,no);row.append(actions);proposals.append(row)}if(!detail.proposals?.length)proposals.append(el("div","meta","Chưa có đề xuất cần duyệt."));d.append(proposals);const ai=el("div","panel");ai.append(el("h2","","AI Agent tóm tắt"),el("div","meta",c.ai_summary||"Chưa có tóm tắt."));const aiBtn=el("button","primary","AI cập nhật tóm tắt");aiBtn.onclick=refreshCustomerSummary;ai.append(aiBtn);d.append(ai,el("h2","","Nhu cầu / Facts"));const facts=el("div","panel");for(const x of detail.facts||[])facts.append(el("div","audit",`${x.fact_key}: ${x.fact_value} · ${Math.round(Number(x.confidence||0)*100)}% · ${x.status}`));if(!detail.facts?.length)facts.append(el("div","meta","Chưa có fact."));d.append(facts,el("h2","","Lịch sử tương tác"));const eps=el("div","panel");for(const x of detail.episodes||[])eps.append(el("div","audit",`${x.happened_at||""} · ${x.source||""} · ${x.event_type||""}\n${x.summary||""}`));if(!detail.episodes?.length)eps.append(el("div","meta","Chưa có tương tác."));d.append(eps,el("h2","","Lead liên kết"));const leads=el("div","panel");for(const x of detail.leads||[])leads.append(el("div","audit",`#${x.id} · ${x.car_id||"chưa ghi xe"} · ${x.status||""} · ${x.message||""}`));if(!detail.leads?.length)leads.append(el("div","meta","Chưa có lead liên kết."));d.append(leads,el("h2","","Audit chăm sóc"));const audit=el("div","panel");for(const x of detail.audit||[])audit.append(el("div","audit",`${x.created_at||""} · ${x.actor||""} · ${x.action||""} · ${x.summary||""}`));if(!detail.audit?.length)audit.append(el("div","meta","Chưa có lịch sử chăm sóc."));d.append(audit)}
async function decideProposal(proposalId,decision){try{detail=await api(`/api/telegram/mini/v1/customers/${encodeURIComponent(detail.customer.id)}/proposals/${encodeURIComponent(proposalId)}`,{method:"POST",body:JSON.stringify({decision})});renderCustomerDetail();await load();notice(decision==="approve"?"Đã duyệt đề xuất AI.":"Đã bỏ qua đề xuất AI.")}catch(e){notice(e.message,true)}}
async function deleteCustomer(){const id=detail?.customer?.id;if(!id)return;const run=async()=>{try{await api(`/api/telegram/mini/v1/customers/${encodeURIComponent(id)}`,{method:"DELETE",body:JSON.stringify({confirm:"DELETE_CUSTOMER",customer_id:id})});detail=null;closeDetail();await load();notice("Đã xóa khách hàng và dữ liệu Memory Brain liên quan.")}catch(e){notice(e.message,true)}};const msg="Xóa khách hàng này? Memory Brain, facts, timeline và chăm sóc liên quan sẽ bị xóa. Lead gốc vẫn được giữ.";if(tg?.showConfirm)tg.showConfirm(msg,ok=>ok&&run());else if(confirm(msg))await run()}
async function saveCustomerCare(){try{const follow=$("#followUp").value;detail=await api(`/api/telegram/mini/v1/customers/${encodeURIComponent(detail.customer.id)}`,{method:"PATCH",body:JSON.stringify({care_status:$("#careStatus").value,note:$("#careNote").value,follow_up_at:follow?new Date(follow).toISOString():""})});await load();renderCustomerDetail();notice("Đã cập nhật chăm sóc khách hàng.")}catch(e){notice(e.message,true)}}
async function refreshCustomerSummary(){try{const id=detail.customer.id,d=await api(`/api/telegram/mini/v1/customers/${encodeURIComponent(id)}/ai-summary`,{method:"POST"});detail.customer.ai_summary=d.summary;await openCustomer(id);notice(d.model==="deterministic"?"Đã cập nhật tóm tắt an toàn (fallback).":"AI đã cập nhật tóm tắt.")}catch(e){notice(e.message,true)}}
function field(grid,key,label,type="text"){const l=el("label","",label),i=el(type==="textarea"?"textarea":"input");i.dataset.field=key;if(type!=="textarea")i.type=type;i.value=detail.car[key]??"";l.append(i);grid.append(l)}
function renderDetail(){const d=$("#detailView");d.replaceChildren();$("#listView").classList.add("hidden");d.classList.remove("hidden");const back=el("button","back","← Danh sách");back.onclick=closeDetail;d.append(back,el("h1","",`${detail.car.brand} ${detail.car.model}`),el("div","meta",`${detail.car.id} · ${labels[detail.car.status]||detail.car.status}`));const p=el("div","panel"),g=el("div","grid");field(g,"brand","Hãng");field(g,"model","Model");field(g,"year","Năm","number");field(g,"mileage","ODO (km)","number");field(g,"price","Giá (VNĐ)","number");field(g,"color","Màu");field(g,"fuel","Nhiên liệu");field(g,"category","Danh mục");field(g,"description","Mô tả","textarea");g.lastChild.classList.add("wide");const save=el("button","primary wide","Lưu thông tin");save.onclick=saveDetail;g.append(save);p.append(g);d.append(p);const pub=el("div","actions");if(detail.public_url){const b=el("button","","Xem trang public");b.onclick=()=>tg?.openLink?tg.openLink(detail.public_url):window.open(detail.public_url,"_blank");pub.append(b)}d.append(pub,el("h2","","Thứ tự ảnh / Cover"));const gallery=el("div","panel gallery");for(let i=0;i<detail.car.images.length;i++){const x=detail.car.images[i],row=el("div",x.is_cover?"photo cover":"photo"),img=el("img");img.src=x.url;img.alt="";const meta=el("div","meta",`#${i+1} · ID ${x.id}${x.is_cover?" · COVER":""}`),up=el("button","","↑"),down=el("button","","↓"),cover=el("button","coverBtn","Đặt cover");up.disabled=i===0;down.disabled=i===detail.car.images.length-1;up.onclick=()=>moveImage(i,-1);down.onclick=()=>moveImage(i,1);cover.onclick=()=>setCover(x.id);row.append(img,meta,up,down,cover);gallery.append(row)}d.append(gallery,el("h2","","Lịch sử thay đổi"));const audit=el("div","panel");for(const x of detail.audit||[])audit.append(el("div","audit",`${x.created_at||""} · ${x.actor||""} · ${x.action||""} · ${x.summary||""}`));if(!detail.audit?.length)audit.append(el("div","meta","Chưa có lịch sử."));d.append(audit)}
function closeDetail(){$("#detailView").classList.add("hidden");$("#listView").classList.remove("hidden");detail=null}
async function saveDetail(){const patch={};document.querySelectorAll("[data-field]").forEach(i=>patch[i.dataset.field]=["year","mileage","price"].includes(i.dataset.field)?(i.value===""?null:Number(i.value)):i.value);try{const d=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(detail.car.id)}`,{method:"PATCH",body:JSON.stringify(patch)});detail.car=d.car;await load();await openCar(d.id);notice("Đã lưu thông tin xe.")}catch(e){notice(e.message,true)}}
function moveImage(i,delta){const a=detail.car.images,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveGallery()}
function setCover(id){detail.car.images.forEach(x=>x.is_cover=Number(x.id)===Number(id)?1:0);saveGallery()}
async function saveGallery(){try{const imgs=detail.car.images,cover=imgs.find(x=>x.is_cover)||imgs[0];const d=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(detail.car.id)}/images/order`,{method:"PUT",body:JSON.stringify({image_ids:imgs.map(x=>Number(x.id)),cover_image_id:Number(cover.id)})});detail.car.images=d.images;detail.car.cover_image=d.cover_image;renderDetail();await load();notice("Đã lưu thứ tự ảnh.")}catch(e){notice(e.message,true);await openCar(detail.car.id)}}
const contentReviewPanel=window.PTXContentReview.create({root:$("#contentReview"),api,base:"/api/telegram/mini/v1/content-review"});$("#contentTab").onclick=()=>setView("content");$("#q").oninput=render;$("#filter").onchange=render;$("#carsTab").onclick=()=>setView("cars");$("#customersTab").onclick=()=>setView("customers");setView(view);load();
</script></body></html>
