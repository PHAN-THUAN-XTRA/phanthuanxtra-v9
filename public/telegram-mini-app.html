<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Quản lý xe | PHAN THUẦN XTRA</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:var(--tg-theme-text-color,#111);background:var(--tg-theme-bg-color,#f4f4f4)}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.head{position:sticky;top:0;background:var(--tg-theme-bg-color,#f4f4f4);padding:7px 0 10px;z-index:4}h1{font-size:22px;margin:3px 0}.sub,.meta{color:var(--tg-theme-hint-color,#687076);font-size:13px}.tools{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-top:10px}input,select,button,textarea{font:inherit;border-radius:10px;border:1px solid var(--tg-theme-hint-color,#bbb);padding:10px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit}button{cursor:pointer}.card{display:grid;grid-template-columns:92px 1fr;gap:11px;background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:11px;margin:9px 0}.thumb{width:92px;height:70px;object-fit:cover;border-radius:9px;background:#ddd}.name{font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{padding:7px 9px;font-size:12px}.active{border-color:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-color,#2481cc);font-weight:700}.primary{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);border:0}.panel{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .wide{grid-column:1/-1}label{display:grid;gap:4px;font-size:12px;color:var(--tg-theme-hint-color,#687076)}textarea{min-height:100px;resize:vertical}.gallery{display:grid;gap:7px}.photo{display:grid;grid-template-columns:64px 1fr auto auto;gap:7px;align-items:center;padding:6px;border:1px solid #ddd;border-radius:10px}.photo img{width:64px;height:50px;object-fit:cover;border-radius:7px}.photo button{padding:6px}.cover{outline:2px solid var(--tg-theme-button-color,#2481cc)}.audit{font-size:12px;border-top:1px solid #ddd;padding:7px 0}.back{margin-bottom:8px}#notice{padding:9px;border-radius:10px;margin-top:7px;display:none}.ok{display:block!important;background:#e7f5e9;color:#185c25}.err{display:block!important;background:#fde8e8;color:#8a1c1c}.hidden{display:none!important}@media(max-width:520px){.tools,.grid{grid-template-columns:1fr}.card{grid-template-columns:72px 1fr}.thumb{width:72px;height:60px}.photo{grid-template-columns:56px 1fr auto}.photo img{width:56px}.photo .coverBtn{grid-column:2/-1}}
</style></head><body><main class="wrap"><div id="listView"><div class="head"><div class="sub">PHAN THUẦN XTRA · TELEGRAM MINI APP</div><h1>Quản lý xe</h1><div class="tools"><input id="q" placeholder="Tìm ID, hãng, mẫu xe…"><select id="filter"><option value="">Tất cả trạng thái</option><option value="available">Đang bán</option><option value="reserved">Đã giữ</option><option value="sold">Đã bán</option><option value="hidden">Đang ẩn</option></select></div><div id="notice"></div><div id="summary" class="meta">Đang xác thực Telegram…</div></div><section id="cars"></section></div><section id="detailView" class="hidden"></section></main>
<script>
const tg=window.Telegram?.WebApp,$=s=>document.querySelector(s),labels={available:"Đang bán",reserved:"Đã giữ",sold:"Đã bán",hidden:"Đang ẩn"};let cars=[],detail=null;if(tg){tg.ready();tg.expand()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function notice(msg,bad=false){const n=$("#notice");n.textContent=msg;n.className=bad?"err":"ok";setTimeout(()=>n.className="",2600)}
async function api(path,opt={}){const init=tg?.initData||"";if(!init)throw Error("Hãy mở Mini App từ bot Telegram.");opt.headers={...(opt.headers||{}),"X-Telegram-Init-Data":init};if(opt.body)opt.headers["content-type"]="application/json";const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Lỗi máy chủ");return d}
function money(v){return Number(v||0).toLocaleString("vi-VN")+" đ"}function odo(v){return v===null||v===undefined||v===""?"Chưa nhập":Number(v).toLocaleString("vi-VN")+" km"}
function render(){const q=$("#q").value.trim().toLowerCase(),status=$("#filter").value,list=cars.filter(c=>(!status||c.status===status)&&(!q||[c.id,c.brand,c.model,c.year].join(" ").toLowerCase().includes(q)));$("#summary").textContent=`${list.length}/${cars.length} xe`;const root=$("#cars");root.replaceChildren();for(const c of list){const card=el("article","card"),img=c.cover_image||c.images?.[0]?.url||"",thumb=img?el("img","thumb"):el("div","thumb");if(img){thumb.src=img;thumb.alt=""}const body=el("div");body.append(el("div","name",`${c.brand||""} ${c.model||""}`.trim()),el("div","meta",`${c.id} · ${c.year||""} · ${money(c.price)} · ${odo(c.mileage)}`));const a=el("div","actions"),open=el("button","primary","Chi tiết / Sửa");open.onclick=()=>openCar(c.id);a.append(open);for(const [s,l] of Object.entries(labels)){const b=el("button",c.status===s?"active":"",l);b.onclick=()=>changeStatus(c.id,s);a.append(b)}body.append(a);card.append(thumb,body);root.append(card)}if(!list.length)root.append(el("p","meta","Không có xe phù hợp."))}
async function load(){try{const d=await api("/api/telegram/mini/v1/cars");cars=d.cars||[];render()}catch(e){$("#summary").textContent="Không thể tải";notice(e.message,true)}}
async function changeStatus(id,status){const c=cars.find(x=>x.id===id);if(!c||c.status===status)return;const go=()=>commitStatus(id,status);if(tg?.showConfirm)tg.showConfirm(`${c.brand} ${c.model}: ${labels[c.status]} → ${labels[status]}`,ok=>ok&&go());else if(confirm("Xác nhận đổi trạng thái?"))go()}
async function commitStatus(id,status){try{await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(id)}/status`,{method:"PATCH",body:JSON.stringify({status})});const c=cars.find(x=>x.id===id);if(c)c.status=status;render();if(detail?.car?.id===id)openCar(id);notice("Đã cập nhật trạng thái.")}catch(e){notice(e.message,true)}}
async function openCar(id){try{detail=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(id)}`);renderDetail()}catch(e){notice(e.message,true)}}
function field(grid,key,label,type="text"){const l=el("label","",label),i=el(type==="textarea"?"textarea":"input");i.dataset.field=key;if(type!=="textarea")i.type=type;i.value=detail.car[key]??"";l.append(i);grid.append(l)}
function renderDetail(){const d=$("#detailView");d.replaceChildren();$("#listView").classList.add("hidden");d.classList.remove("hidden");const back=el("button","back","← Danh sách");back.onclick=closeDetail;d.append(back,el("h1","",`${detail.car.brand} ${detail.car.model}`),el("div","meta",`${detail.car.id} · ${labels[detail.car.status]||detail.car.status}`));const p=el("div","panel"),g=el("div","grid");field(g,"brand","Hãng");field(g,"model","Model");field(g,"year","Năm","number");field(g,"mileage","ODO (km)","number");field(g,"price","Giá (VNĐ)","number");field(g,"color","Màu");field(g,"fuel","Nhiên liệu");field(g,"category","Danh mục");field(g,"description","Mô tả","textarea");g.lastChild.classList.add("wide");const save=el("button","primary wide","Lưu thông tin");save.onclick=saveDetail;g.append(save);p.append(g);d.append(p);const pub=el("div","actions");if(detail.public_url){const b=el("button","","Xem trang public");b.onclick=()=>tg?.openLink?tg.openLink(detail.public_url):window.open(detail.public_url,"_blank");pub.append(b)}d.append(pub,el("h2","","Thứ tự ảnh / Cover"));const gallery=el("div","panel gallery");for(let i=0;i<detail.car.images.length;i++){const x=detail.car.images[i],row=el("div",x.is_cover?"photo cover":"photo"),img=el("img");img.src=x.url;img.alt="";const meta=el("div","meta",`#${i+1} · ID ${x.id}${x.is_cover?" · COVER":""}`),up=el("button","","↑"),down=el("button","","↓"),cover=el("button","coverBtn","Đặt cover");up.disabled=i===0;down.disabled=i===detail.car.images.length-1;up.onclick=()=>moveImage(i,-1);down.onclick=()=>moveImage(i,1);cover.onclick=()=>setCover(x.id);row.append(img,meta,up,down,cover);gallery.append(row)}d.append(gallery,el("h2","","Lịch sử thay đổi"));const audit=el("div","panel");for(const x of detail.audit||[])audit.append(el("div","audit",`${x.created_at||""} · ${x.actor||""} · ${x.action||""} · ${x.summary||""}`));if(!detail.audit?.length)audit.append(el("div","meta","Chưa có lịch sử."));d.append(audit)}
function closeDetail(){$("#detailView").classList.add("hidden");$("#listView").classList.remove("hidden");detail=null}
async function saveDetail(){const patch={};document.querySelectorAll("[data-field]").forEach(i=>patch[i.dataset.field]=["year","mileage","price"].includes(i.dataset.field)?(i.value===""?null:Number(i.value)):i.value);try{const d=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(detail.car.id)}`,{method:"PATCH",body:JSON.stringify(patch)});detail.car=d.car;await load();await openCar(d.id);notice("Đã lưu thông tin xe.")}catch(e){notice(e.message,true)}}
function moveImage(i,delta){const a=detail.car.images,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveGallery()}
function setCover(id){detail.car.images.forEach(x=>x.is_cover=Number(x.id)===Number(id)?1:0);saveGallery()}
async function saveGallery(){try{const imgs=detail.car.images,cover=imgs.find(x=>x.is_cover)||imgs[0];const d=await api(`/api/telegram/mini/v1/cars/${encodeURIComponent(detail.car.id)}/images/order`,{method:"PUT",body:JSON.stringify({image_ids:imgs.map(x=>Number(x.id)),cover_image_id:Number(cover.id)})});detail.car.images=d.images;detail.car.cover_image=d.cover_image;renderDetail();await load();notice("Đã lưu thứ tự ảnh.")}catch(e){notice(e.message,true);await openCar(detail.car.id)}}
$("#q").oninput=render;$("#filter").onchange=render;load();
</script></body></html>
